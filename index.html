/* =========================================================
   ÍCONE OPCIONAL: imagem sua ou um símbolo, para cada nome
   ========================================================= */
const iconPickerHTML = () => `<div class="form-label">Ícone <span class="opt">(opcional)</span></div>
  <div class="group"><div class="icon-row"><span id="f-ipv"></span><div class="ir-txt"><span id="f-itxt">Automático</span>
    <small>Vale para todos os itens com esse nome.</small></div></div></div>
  <div class="pill-btns"><label>${ICON.image}<span>Imagem</span><input type="file" id="f-iimg" class="vh" accept="image/*"></label>
    <button type="button" id="f-isym">${ICON.shapes}<span>Símbolo</span></button>
    <button type="button" id="f-iauto" class="danger" hidden>Automático</button></div>
  <div class="group mt" id="f-glyphs" hidden><div class="glyphs">${Object.keys(GLYPH_NAMES).map(g => `<button type="button" class="glyph" data-glyph="${g}" aria-label="${GLYPH_NAMES[g]}">${G[g]}</button>`).join('')}</div></div>`;
/* Recorta a imagem em quadrado e diminui (128 px) para não pesar */
function readIcon(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const n = 128, cv = document.createElement('canvas'); cv.width = cv.height = n;
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      cv.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, n, n);
      URL.revokeObjectURL(url); res(cv.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
/* draw(nome, ícone) desenha a prévia. Retorna get(): undefined = sem mudança, null = automático */
function attachIconPicker(sh, getName, draw, onChange) {
  let pending;
  const cur = () => (pending !== undefined ? pending : iconFor(getName())) || null;
  const paint = () => {
    const ic = cur();
    $('#f-ipv', sh).innerHTML = draw(getName(), ic);
    $('#f-itxt', sh).textContent = ic && ic.img ? 'Sua imagem' : ic && ic.glyph ? 'Símbolo: ' + GLYPH_NAMES[ic.glyph] : 'Automático';
    $('#f-iauto', sh).hidden = !ic;
    sh.querySelectorAll('.glyph').forEach(b => b.classList.toggle('on', !!(ic && ic.glyph === b.dataset.glyph)));
    if (onChange) onChange(ic);
  };
  sh.addEventListener('click', e => {
    if (e.target.closest('#f-isym')) { const g = $('#f-glyphs', sh); g.hidden = !g.hidden; return; }
    if (e.target.closest('#f-iauto')) { pending = null; paint(); return; }
    const b = e.target.closest('.glyph'); if (b) { pending = { glyph: b.dataset.glyph }; paint(); }
  });
  $('#f-iimg', sh).addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    try { pending = { img: await readIcon(f) }; paint(); } catch (err) { toast('Não deu para abrir essa imagem.'); }
  });
  paint();
  return { paint, get: () => pending };
}
function applyIcon(name, pending) {
  const k = norm(name); if (pending === undefined || !k) return;
  S.icons = S.icons || {};
  if (pending === null) delete S.icons[k]; else S.icons[k] = { ...pending, name };
}
const incomeTile = (name, ic) => { ic = ic !== undefined ? ic : iconFor(name); return ic && ic.img ? imgTile(ic.img) : tile((ic && ic.glyph) || 'money', '#34C759'); };

const PROJ_COLORS = ['#30B0C7', '#5856D6', '#FF9500', '#34C759', '#FF2D55', '#AF52DE', '#A2845E', '#636366'];
function readPhoto(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1000, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);

      res(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('foto')); };
    img.src = url;
  });
}

/* =========================================================
   CÓPIA DE SEGURANÇA, EXEMPLO E APAGAR TUDO
   ========================================================= */
async function exportBackup() {
  const name = `minhas-contas-${todayISO()}.json`;
  const blob = new Blob([JSON.stringify({ app: 'minhas-contas', version: 2, exportedAt: new Date().toISOString(), data: S }, null, 2)], { type: 'application/json' });
  const done = () => { S.lastBackup = Date.now(); commit(); toast('Cópia pronta'); };
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Cópia de segurança' }); done(); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  done();
}
function importBackup(file) {
  const r = new FileReader();
  r.onload = async () => {
    let d; try { const j = JSON.parse(r.result); d = j && j.data ? j.data : j; } catch (e) { d = null; }
    if (!d || typeof d !== 'object' || !d.months) { toast('Esse arquivo não é uma cópia deste app.'); return; }
    if (!await askConfirm({ title: 'Restaurar cópia?', message: 'Os dados de agora serão trocados pelos da cópia. Cópias da versão 1 também funcionam.', ok: 'Restaurar' })) return;
    S = Object.assign(emptyState(), d, { v: 2 }); ui.page = null; document.documentElement.dataset.paper = S.paper || 'liso'; commit(); toast('Cópia restaurada');
  };
  r.onerror = () => toast('Não deu para ler o arquivo.');
  r.readAsText(file);
}
async function wipeAll() {
  if (!await askConfirm({ title: 'Apagar tudo?', message: 'Contas, cartões, projetos e dívidas vão sumir deste aparelho.', ok: 'Apagar', danger: true })) return;
  if (!await askConfirm({ title: 'Tem certeza mesmo?', message: 'Não dá para desfazer. Se quiser, faça uma cópia antes.', ok: 'Apagar tudo', danger: true })) return;
  S = emptyState(); try { localStorage.removeItem(KEY); } catch (_) {}
  ui.tab = 'home'; ui.page = null; ui.view = todayKey(); commit(); toast('Tudo apagado');
}

/* =========================================================
   TOQUES E CLIQUES
   ========================================================= */
let ignoreClick = false;
function fabAction() {
  const p = ui.page || '';
  if (p === 'subs') return openExpense({ type: 'assin' });
  if (p === 'recv') return openRecv();
  if (p === 'debts') return openDebt();
  if (p.startsWith('card:')) return openExpense({ type: 'compra', cardId: p.slice(5) });
  if (p.startsWith('proj:')) { const pr = projById(p.slice(5)); return pr && openProjItem(pr); }
  if (ui.tab === 'cards') return openCard();
  if (ui.tab === 'projects') return openProject();
  return openExpense();
}
function editAny(type, id) {
  const it = findItem(type, id); if (!it) return;
  if (type === 'bill' || type === 'inst' || type === 'sub') openExpense({ item: it, itemType: type });
  else if (type === 'income') openIncome(it);
  else if (type === 'recv') openRecv({ item: it });
  else if (type === 'debt') openDebt(it);
  else if (type === 'pitem') openProjItem(projOfItem(id), it);
}

document.addEventListener('click', e => {
  if (ignoreClick) { ignoreClick = false; e.preventDefault(); e.stopPropagation(); return; }
  if (bubble && !e.target.closest('[data-act="help"]')) hideHelp();
  const sh = e.target.closest('[data-sheet]');
  if (sh && SH) {
    const a = sh.dataset.sheet;
    if (a === 'close') closeSheet();
    else if (a === 'save') { if (sh.disabled) return; if (SH.onSave(SH.sheet) !== false) closeSheet(); }
    else if (a === 'delete') { const fn = SH.onDelete; closeSheet(); if (fn) fn(); }
    return;
  }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const r = el.closest('[data-id]'), type = r && r.dataset.type, id = r && r.dataset.id;
  switch (el.dataset.act) {
    case 'tab': if (ui.tab !== el.dataset.tab || ui.page) { ui.page = null; ui.tab = el.dataset.tab; ui.anim = ''; scrollTo(0, 0); render(); } else scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'open': go(el.dataset.tab, el.dataset.page || null); break;
    case 'back': ui.page = null; ui.anim = 'pop'; scrollTo(0, 0); render(); break;
    case 'openMonth': ui.view = el.dataset.k; go('mes'); break;
    case 'prevMonth': ui.view = addMonths(ui.view, -1); render(); break;
    case 'nextMonth': ui.view = addMonths(ui.view, 1); render(); break;
    case 'today': ui.view = todayKey(); render(); break;
    case 'chartPick': ui.chartSel = el.dataset.k; render(); break;
    case 'chartTable': ui.chartTable = !ui.chartTable; render(); break;
    case 'range': ui.range = +el.dataset.n; render(); break;
    case 'paper': S.paper = el.dataset.v; document.documentElement.dataset.paper = S.paper; commit(); break;
    case 'fold': { S.fold = S.fold || {}; const k = el.dataset.key; if (S.fold[k]) delete S.fold[k]; else S.fold[k] = 1; save(); render(); break; }
    case 'clearSearch': ui.q = ''; render(); break;
    case 'delIcon': { const snap = JSON.stringify(S.icons || {}); delete S.icons[el.dataset.key]; commit(); toast('Ícone removido', { label: 'Desfazer', fn: () => { S.icons = JSON.parse(snap); commit(); } }); break; }
    case 'editPage': { const p = ui.page || ''; if (p.startsWith('card:')) openCard(cardById(p.slice(5))); else if (p.startsWith('proj:')) openProject(projById(p.slice(5))); break; }
    case 'toggleFatura': { const c = cardById(el.dataset.id); if (c) { c.paidFatura = c.paidFatura || {}; if (el.checked) c.paidFatura[ui.view] = true; else delete c.paidFatura[ui.view]; save(); clearTimeout(renderTimer); renderTimer = setTimeout(render, 250); } break; }
    case 'help': showHelp(el); break;
    case 'copy': copyText(el.dataset.text); break;
    case 'seed': seedExample(); break;
    case 'clearEx': clearExample(); break;
    case 'export': exportBackup(); break;
    case 'wipe': wipeAll(); break;
    case 'sort': ui.debtSort = el.dataset.sort; render(); break;
    case 'fab': fabAction(); break;
    case 'add': {
      const p = el.dataset.preset;
      if (p === 'income') openIncome();
      else if (p === 'recv') openRecv({ projectId: el.dataset.pid });
      else if (p === 'debt') openDebt();
      else if (p === 'pitem') { const pr = projById(el.dataset.pid); if (pr) openProjItem(pr); }
      else openExpense({ type: p, cardId: el.dataset.card });
      break;
    }
    case 'addRecvFor': openRecv({ person: el.dataset.person }); break;
    case 'toggle': {
      el.classList.toggle('on'); el.setAttribute('aria-pressed', String(el.classList.contains('on')));
      const before = monthTotals(ui.view);
      r.classList.toggle('done'); applyToggle(type, id); save();
      const after = monthTotals(ui.view);
      if (after.out && after.paid >= after.out && before.paid < before.out) toast('Tudo pago neste mês. Parabéns!');
      else if (after.inc && after.rec >= after.inc && before.rec < before.inc) toast('Você recebeu tudo deste mês!');
      clearTimeout(renderTimer); renderTimer = setTimeout(render, 320);
      break;
    }
    case 'edit': editAny(type, id); break;
    case 'del': deleteItem(type, id); break;
    case 'startNext': {
      const next = addMonths(ui.view, 1), n = copyRecurring(ui.view, next);
      ui.view = next; scrollTo(0, 0); commit();
      toast(n ? `${monthName(next)} começou. ${n} ${n === 1 ? 'item copiado' : 'itens copiados'}.` : `Você está em ${monthName(next).toLowerCase()}.`);
      break;
    }
    case 'copyFrom': { const n = copyRecurring(el.dataset.from, ui.view); commit(); toast(n ? `${n} ${n === 1 ? 'item trazido' : 'itens trazidos'}` : 'Nada para trazer'); break; }
  }
});

    const digits = t.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 12);
    setC(t, parseInt(digits || '0', 10));
    requestAnimationFrame(() => { try { t.setSelectionRange(t.value.length, t.value.length); } catch (_) {} });
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('msw-input') && /^\d{4}-\d{2}$/.test(t.value)) { ui.view = t.value; render(); }
  if (t.id === 'f-import') { const f = t.files && t.files[0]; if (f) importBackup(f); t.value = ''; }
});

/* Deslizar a linha para a esquerda mostra Editar e Apagar */
const ACTW = 152; let swp = null;
function closeRow() { if (!openRow) return; const r = openRow, m = r.querySelector('.row-main'); if (m) m.style.transform = ''; setTimeout(() => r.classList.remove('open'), 300); openRow = null; }
document.addEventListener('touchstart', e => {
  ignoreClick = false;
  if (openRow && !e.target.closest('.row-actions')) { closeRow(); ignoreClick = true; }
  const main = e.target.closest('.row-main');
  if (!main || SH) { swp = null; return; }
  const t = e.touches[0]; swp = { main, row: main.parentElement, x: t.clientX, y: t.clientY, dx: 0, dir: null };
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!swp) return;
  const t = e.touches[0], dx = t.clientX - swp.x, dy = t.clientY - swp.y;
  if (!swp.dir) { if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; swp.dir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v'; if (swp.dir === 'h') { swp.main.style.transition = 'none'; swp.row.classList.add('swiping'); } }
  if (swp.dir !== 'h') return;
  e.preventDefault(); swp.dx = Math.min(0, Math.max(-ACTW - 50, dx)); swp.main.style.transform = `translateX(${swp.dx}px)`;
}, { passive: false });
document.addEventListener('touchend', () => {
  if (!swp) return; const s = swp; swp = null; if (s.dir !== 'h') return;
  s.main.style.transition = ''; ignoreClick = true;
  if (s.dx < -ACTW / 2) { s.main.style.transform = `translateX(${-ACTW}px)`; s.row.classList.add('open'); openRow = s.row; } else s.main.style.transform = '';
  setTimeout(() => s.row.classList.remove('swiping'), 300);
});
addEventListener('scroll', () => { $('#nav').classList.toggle('scrolled', scrollY > 34); if (bubble) hideHelp(); }, { passive: true });
let lastToday = todayKey();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && todayKey() !== lastToday) { if (ui.view === lastToday) ui.view = todayKey(); lastToday = todayKey(); render(); }
});

/* =========================================================
   INÍCIO
   ========================================================= */
(function init() {
  document.documentElement.dataset.paper = S.paper || 'liso';
  $('#fab').innerHTML = ICON.compose;
  $('#tabbar').innerHTML = TABS.map(t => `<button class="tab" role="tab" data-act="tab" data-tab="${t.id}" aria-selected="false">${ICON[t.id]}<span>${t.label}</span></button>`).join('');
  try {   /* ícone da Tela de Início, desenhado na hora */
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    x.fillStyle = '#1C1C1E'; x.fillRect(0, 0, 180, 180); x.fillStyle = '#FFFFFF';
    x.font = '700 74px -apple-system, "Helvetica Neue", sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('R$', 90, 95);
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
  } catch (e) { /* sem canvas */ }
  render();
  if (migrated) { save(); toast('Seus dados da versão anterior foram trazidos.'); }
})();
</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contas">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Minhas Contas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F2B300'/%3E%3Ctext x='50' y='65' font-family='-apple-system,Helvetica,Arial' font-size='42' font-weight='700' fill='%231C1C1E' text-anchor='middle'%3ER$%3C/text%3E%3C/svg%3E">
<style>
/* =========================================================
   TEMA — inspirado no app Notas do iPhone
   Papel branco (liso, com linhas ou quadriculado), amarelo do Notas,
   marca-texto colorido e contas no estilo "Notas Matemáticas".
   ========================================================= */
:root{
  --page:#FFFFFF; --soft:#F2F2F7; --sheetbg:#F2F2F7; --sheetcard:#FFFFFF; --card:#FFFFFF;
  --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.16); --grid:#C6C6C8; --rule:rgba(60,60,67,.11); --fill:rgba(118,118,128,.12); --fill2:rgba(120,120,128,.2);
  --tint:#F2B300; --tint-text:#946A00; --tint-soft:rgba(242,179,0,.16); --on-tint:#1C1C1E;
  --green:#34C759; --green-t:#248A3D; --red:#FF3B30; --red-t:#D70015; --orange-t:#C93400; --blue-t:#0062CC; --gray:#8E8E93;
  --c-in:#007AFF; --c-out:#FF9500;            /* gráfico: validado para daltonismo */
  --hl-orange:rgba(255,159,10,.3); --hl-mint:rgba(0,199,190,.26); --hl-purple:rgba(175,82,222,.22); --hl-blue:rgba(0,122,255,.16); --hl-pink:rgba(255,45,85,.2);
  --bar:rgba(255,255,255,.86); --segon:#FFFFFF; --alertbg:rgba(242,242,242,.97); --bubble:rgba(28,28,30,.96);
  --mono:ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --tabh:50px; --r:12px;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#000000; --soft:#1C1C1E; --sheetbg:#1C1C1E; --sheetcard:#2C2C2E; --card:#1C1C1E;
    --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.55); --grid:#48484A; --rule:rgba(235,235,245,.1); --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.36);
    --tint:#FFD60A; --tint-text:#FFD60A; --tint-soft:rgba(255,214,10,.16);
    --green:#30D158; --green-t:#30D158; --red:#FF453A; --red-t:#FF6961; --orange-t:#FFB340; --blue-t:#64A8FF;
    --c-in:#0A84FF; --c-out:#D97706;
    --hl-orange:rgba(255,159,10,.34); --hl-mint:rgba(99,230,226,.26); --hl-purple:rgba(191,90,242,.3); --hl-blue:rgba(10,132,255,.28); --hl-pink:rgba(255,55,95,.3);
    --bar:rgba(18,18,18,.86); --segon:#636366; --alertbg:rgba(44,44,46,.97); --bubble:rgba(72,72,74,.98);
  }
}

/* =========================================================
   BASE E PAPEL
   ========================================================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--page)}
html.locked,html.locked body{overflow:hidden}
body{margin:0;background-color:var(--page);color:var(--label);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
  font-size:17px;line-height:1.3;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 100px)}
/* Papel com linhas ou quadriculado, como em Notas → Linhas e Grades */
html[data-paper="linhas"] body{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31.5px,var(--rule) 31.5px,var(--rule) 32px);background-attachment:local}
html[data-paper="grade"] body{background-image:linear-gradient(var(--rule) .5px,transparent .5px),linear-gradient(90deg,var(--rule) .5px,transparent .5px);background-size:24px 24px;background-attachment:local}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,[role=button]:focus-visible,tr:focus-visible,label:focus-within{outline:2px solid var(--tint);outline-offset:2px}
.field:focus-within,.search:focus-within{outline:none}
h1,h2,h3,h4,p{margin:0}
img{display:block;max-width:100%}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
main{max-width:680px;margin:0 auto}
main.push{animation:pushIn .3s cubic-bezier(.2,.85,.25,1)}
main.pop{animation:popIn .3s cubic-bezier(.2,.85,.25,1)}
@keyframes pushIn{from{transform:translateX(22%);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-12%);opacity:0}to{transform:none;opacity:1}}
.muted{color:var(--label2)} .small{font-size:13px} .pos{color:var(--green-t)} .neg{color:var(--red-t)}
.mt6{margin-top:6px} .mt{margin-top:16px!important}
.rb{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* Marca-texto (cores do Notas) */
.hl{border-radius:5px;padding:0 5px;margin:0 -2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl.orange{background:var(--hl-orange)} .hl.mint{background:var(--hl-mint)} .hl.purple{background:var(--hl-purple)} .hl.blue{background:var(--hl-blue)} .hl.pink{background:var(--hl-pink)}

/* =========================================================
   BARRA DO TOPO, DATA DA NOTA E TÍTULO
   ========================================================= */
.nav{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);border-bottom:.5px solid transparent;transition:background-color .25s,border-color .25s}
.nav.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.nav-in{position:relative;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;max-width:680px;margin:0 auto}
.nav-title{position:absolute;left:96px;right:96px;text-align:center;font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.scrolled .nav-title{opacity:1}
.back{display:flex;align-items:center;gap:1px;height:44px;padding:0 8px 0 0;color:var(--tint-text);font-size:17px}
.back svg{width:24px;height:24px}
.link{color:var(--tint-text);font-size:17px;height:44px;padding:0 10px}
.back:active,.link:active,.icon-btn:active{opacity:.4}
.link.strong{font-weight:600}
.link:disabled{color:var(--label3);cursor:default}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;color:var(--tint-text);border-radius:22px;flex:none}
.icon-btn svg{width:22px;height:22px}
.note-date{text-align:center;font-size:13px;color:var(--label2);padding:2px 16px 10px}
.large{padding:0 16px 4px}
.large h1{font-size:30px;font-weight:700;letter-spacing:.005em;line-height:36px}
.lead{margin-top:3px;color:var(--label2);font-size:15px}
.pinned{display:flex;align-items:center;gap:6px;padding:14px 16px 6px;font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.03em}
.pinned svg{width:15px;height:15px;color:var(--tint-text)}

.msw{position:relative}
.msw-label{position:relative;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.msw-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;-webkit-appearance:none;appearance:none;border:0;cursor:pointer;font-size:16px}
.msw.big{display:flex;align-items:center;justify-content:space-between}
.msw.big .msw-label{font-size:30px;font-weight:700;line-height:36px}
.msw.big .msw-label svg{width:16px;height:16px;color:var(--tint-text);margin-top:4px}
.msw.big .arrows{display:flex;margin-right:-10px}
.msw.small{display:inline-flex;align-items:center;margin:2px 0 0 -12px}
.msw.small .msw-label{font-size:17px;font-weight:600;color:var(--tint-text);padding:0 2px}
.msw .icon-btn svg{width:18px;height:18px}

/* Busca, como no topo da lista do Notas */
.search{display:flex;align-items:center;gap:6px;margin:4px 16px 4px;height:38px;padding:0 10px;border-radius:11px;background:var(--fill)}
.search svg{width:17px;height:17px;color:var(--label2);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:17px;color:var(--label);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--label2)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search .clear{width:22px;height:22px;border-radius:50%;background:var(--label3);color:var(--page);display:grid;place-items:center;flex:none}
.search .clear svg{width:11px;height:11px;color:var(--page)}

/* =========================================================
   BLOCOS DA NOTA (citação com barra amarela)
   ========================================================= */
.quote{margin:14px 16px 0;padding:2px 0 2px 14px;border-left:3px solid var(--tint)}
.panel{margin:14px 16px 0;padding:2px 0 2px 14px;border-left:3px solid var(--tint)}
.panel.tap{display:block;width:calc(100% - 32px);text-align:left}
.panel.tap:active{opacity:.6}
.p-label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--label2)}
.p-big{display:inline-block;margin-top:3px;font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:40px;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.p-grid b{display:block;margin-top:2px;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-grid.three{grid-template-columns:1fr 1fr 1fr}
.p-grid.three b{font-size:15px}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;flex:none}
.paid-line{margin-top:3px;font-size:15px;color:var(--label2);font-variant-numeric:tabular-nums}
.paid-line strong{color:var(--label);font-size:17px;font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:var(--tint);border-radius:3px;transition:width .5s cubic-bezier(.2,.85,.25,1)}
.bar.blue>i{background:var(--c-in)}
.bar.warn>i{background:var(--red)}
.alert-line{margin-top:6px;font-size:13px;color:var(--red-t)}
.divider{height:.5px;background:var(--sep);margin:14px 0}

/* Duas colunas: falta pagar / falta receber */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px;margin-top:6px}
.duo .panel{margin:0;width:auto}
.duo .p-big{font-size:24px;line-height:32px}

/* Carimbo de "Tudo pago" */
.stamp{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:4px 10px;border:2px solid var(--green-t);border-radius:8px;color:var(--green-t);font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;transform:rotate(-4deg);animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}
.stamp svg{width:14px;height:14px}
@keyframes stamp{0%{transform:rotate(-4deg) scale(2);opacity:0}100%{transform:rotate(-4deg) scale(1);opacity:1}}

/* Contas no estilo "Notas Matemáticas": resultado em amarelo */
.math{padding:10px 16px 0;font-family:var(--mono);font-size:15px;line-height:1.5;color:var(--label);letter-spacing:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.math .res{color:var(--tint-text);font-weight:600}
.quote .math,.panel .math{padding:8px 0 0}

/* Gráfico */
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--label2);margin-top:2px}
.legend span{display:flex;align-items:center;gap:5px}
.readout{margin-top:12px;font-size:15px;font-variant-numeric:tabular-nums}
.readout strong{font-weight:600}
.chart{display:block;width:100%;height:auto;margin-top:6px;overflow:visible}
.chart .b-in{fill:var(--c-in)} .chart .b-out{fill:var(--c-out)}
.chart .grid{stroke:var(--sep);stroke-width:.6}
.chart .ax{font-size:10px;fill:var(--label2);font-family:inherit}
.chart .mx{font-size:11px;fill:var(--label2);font-family:inherit;text-anchor:middle}
.chart .mx.sel{fill:var(--label);font-weight:700}
.chart .band{fill:var(--tint-soft)}
.chart .hit{fill:transparent;cursor:pointer}
.mini-link{color:var(--tint-text);font-size:15px;font-weight:500;min-height:34px;padding:0 4px}
.chart-wrap{padding:4px 16px 0}
.ctbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;margin-top:10px}
.ctbl th,.ctbl td{padding:7px 4px;text-align:right;border-bottom:.5px solid var(--sep);white-space:nowrap}
.ctbl th:first-child,.ctbl td:first-child{text-align:left}
.ctbl th{font-weight:600;color:var(--label2);font-size:12px}

/* Meses como notas na visualização em galeria */
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
.mcard{position:relative;display:flex;flex-direction:column;min-width:0;text-align:left;border-radius:12px;background:var(--card);padding:12px 12px 10px;
  box-shadow:0 0 0 .5px var(--grid),0 2px 6px rgba(0,0,0,.05);transition:transform .15s}
@media (prefers-color-scheme: dark){.mcard{box-shadow:0 0 0 .5px var(--grid)}}
.mcard:active{transform:scale(.97)}
.mcard.now{box-shadow:0 0 0 2px var(--tint),0 2px 8px rgba(0,0,0,.06)}
.mcard.empty{opacity:.5}
.mc-name{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:16px;font-weight:700}
.mc-name svg{width:14px;height:14px;color:var(--tint-text);flex:none}
.mc-line{display:flex;justify-content:space-between;gap:6px;margin-top:5px;font-family:var(--mono);font-size:12.5px;letter-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.mc-line span:first-child{color:var(--label2);font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;display:flex;align-items:center;gap:5px}
.mc-line.total{margin-top:8px;padding-top:7px;border-top:.5px dashed var(--grid);font-size:14px;font-weight:600}
.mc-line.total span:last-child{color:var(--tint-text)}
.mc-line.total span.neg:last-child{color:var(--red-t)}
.mc-date{margin-top:8px;font-size:11px;color:var(--label3)}

/* =========================================================
   SEÇÕES (títulos que recolhem, como no Notas) E CHECKLISTS
   ========================================================= */
.sec{margin-top:26px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px 4px 6px;min-height:40px}
.sec-head h3{min-width:0;display:flex;align-items:center;gap:4px;font-size:22px;font-weight:600;letter-spacing:-.01em}
.fold{display:flex;align-items:center;gap:4px;min-height:40px;padding:0 4px 0 6px;text-align:left;min-width:0}
.fold svg{width:15px;height:15px;color:var(--tint-text);flex:none;transition:transform .25s}
.fold[aria-expanded="false"] svg{transform:rotate(-90deg)}
.fold span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-right{font-size:15px;color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:8px}
.sec-add{width:44px;height:44px;display:grid;place-items:center;color:var(--tint-text);border-radius:22px;flex:none}
.sec-add svg{width:24px;height:24px}
.sec-add:active{opacity:.4}
.sec-foot{padding:8px 16px 0;font-size:13px;color:var(--label2)}
.sec-closed{padding:0 16px;font-size:14px;color:var(--label2)}
.group{margin:0}
.group.boxed{background:var(--card);border-radius:12px;margin:0 16px;overflow:hidden;box-shadow:0 0 0 .5px var(--grid)}

/* Ícones: círculo suave com o símbolo na cor da categoria */
.tile{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:9px;color:var(--tc);background:var(--tc);background:color-mix(in srgb,var(--tc) 15%,transparent)}
.tile svg{width:19px;height:19px}
.tile.img{background:var(--card);overflow:hidden;box-shadow:0 0 0 .5px var(--grid)}
.tile.img img{width:100%;height:100%;object-fit:cover}
.tile.sm{width:24px;height:24px;border-radius:7px}
.tile.sm svg{width:15px;height:15px}
.folder{flex:none;width:30px;height:30px;display:grid;place-items:center;color:var(--tint-text)}
.folder svg{width:26px;height:26px}

/* Linha de checklist (deslizar para o lado mostra Editar e Apagar) */
.row{position:relative;overflow:hidden}
.row-actions{position:absolute;top:0;right:0;bottom:0;display:flex;visibility:hidden}
.row.swiping .row-actions,.row.open .row-actions{visibility:visible}
.ra{width:76px;color:#fff;font-size:15px;font-weight:500}
.ra-edit{background:var(--gray)} .ra-del{background:var(--red)}
.row-main{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;background:transparent;
  touch-action:pan-y;transition:transform .28s cubic-bezier(.2,.85,.25,1);-webkit-touch-callout:none}
.row.swiping .row-main,.row.open .row-main{background:var(--page)}
.group.boxed .row-main{background:var(--card)}
.check{position:relative;flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #C7C7CC;display:grid;place-items:center;color:#fff;
  transition:background-color .2s,border-color .2s,transform .15s}
@media (prefers-color-scheme: dark){.check{border-color:#636366}.check.on svg{color:#000}}
.check::before{content:"";position:absolute;inset:-10px}
.check svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.check.on{background:var(--tint);border-color:var(--tint)}
.check.on svg{opacity:1;transform:scale(1)}
.check:active{transform:scale(.84)}
.row-text{flex:1;min-width:0;cursor:pointer;-webkit-user-select:none;user-select:none}
.row-title{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin-top:2px;font-size:13px;color:var(--label2)}
.row-value{flex:none;text-align:right;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-value small{display:block;font-size:12px;color:var(--label2);margin-top:1px}
.row.done .row-title,.row.done .row-value,.row.done .row-value.pos{color:var(--label2)}
.row.done .tile{opacity:.5}

.pix{position:relative;display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:var(--tint-text);background:var(--tint-soft);border-radius:8px;padding:2px 8px}
.pix::before{content:"";position:absolute;inset:-8px -4px}
.pix:active{opacity:.5}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--fill);color:var(--label2);white-space:nowrap}
.badge.orange{background:var(--hl-orange);color:var(--orange-t)}
.badge.red{background:var(--hl-pink);color:var(--red-t)}
.badge.green{background:rgba(52,199,89,.16);color:var(--green-t)}
.badge.blue{background:var(--hl-blue);color:var(--blue-t)}
.badge.yellow{background:var(--tint-soft);color:var(--tint-text)}

.empty-row{display:block;width:calc(100% - 32px);margin:2px 16px;padding:14px;text-align:left;color:var(--label2);font-size:15px;border-radius:10px;background:var(--fill)}
.empty-row b{color:var(--tint-text);font-weight:600}
.empty-row:active{opacity:.6}
.nav-row,.add-row,.set-row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:8px 16px;text-align:left;font-size:17px;cursor:pointer}
.group.boxed .nav-row+.nav-row::before,.group.boxed .set-row+.set-row::before,.group.boxed .set-row+label.set-row::before,.group.boxed label.set-row+.set-row::before{content:"";position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--sep)}
.nav-row:active,.add-row:active,.set-row:active{opacity:.55}
.nr-text{flex:1;min-width:0}
.nr-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nr-sub{display:block;font-size:13px;color:var(--label2);margin-top:1px}
.nr-val{font-variant-numeric:tabular-nums;color:var(--label2);white-space:nowrap}
.chev{width:14px;height:14px;color:var(--label3);flex:none}
.add-row{color:var(--tint-text)}
.add-row svg{width:22px;height:22px}
.set-row{color:var(--tint-text)}
.set-row.danger{color:var(--red)}
.info-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:0 16px;font-size:16px}
.info-row+.info-row{border-top:.5px solid var(--sep)}
.info-row .ir-l{color:var(--label2);display:flex;align-items:center;gap:6px}
.info-row .ir-v{font-variant-numeric:tabular-nums;text-align:right;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pix-line{display:flex;align-items:center;gap:8px;padding:0 16px 6px;font-family:var(--mono);font-size:14px;color:var(--label2);letter-spacing:0}
.pix-line .pl-key{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pix-line .help{font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.del-btn{color:var(--red);font-size:15px;font-weight:500;min-height:34px;padding:0 10px}

/* Tabelas do Notas */
.tbl-wrap{margin:4px 16px 0;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:.5px solid var(--grid);padding:8px;text-align:left;vertical-align:middle}
.tbl th{font-weight:600}
.tbl td.num{white-space:nowrap}
.trow{cursor:pointer}
.trow:active td{background:var(--fill)}
.trow.done .cell-title,.trow.done td.num{color:var(--label2)}
.cell-main{display:flex;align-items:center;gap:10px;min-width:0}
.cell-main .check{width:22px;height:22px}
.cell-text{display:flex;flex-direction:column;min-width:0}
.cell-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-sub{font-size:12px;color:var(--label2);margin-top:1px}

/* Barras de categoria */
.catrow{display:flex;align-items:center;gap:12px;padding:9px 16px}
.cat-main{flex:1;min-width:0}
.cat-top{display:flex;justify-content:space-between;gap:8px;font-size:16px}
.cat-top span:last-child{font-variant-numeric:tabular-nums}
.cat-bar{height:5px;border-radius:3px;background:var(--fill);margin-top:6px;overflow:hidden}
.cat-bar i{display:block;height:100%;border-radius:3px}
.cat-pct{font-size:12px;color:var(--label2);margin-top:3px}

/* =========================================================
   CARTÃO DE CRÉDITO (desenho fictício ou imagem sua)
   ========================================================= */
.ccwrap{padding:0 16px;margin-top:14px}
.cc{position:relative;display:block;width:100%;max-width:400px;aspect-ratio:1.586;border-radius:16px;padding:18px 20px;color:#fff;text-align:left;overflow:hidden;
  background:var(--cc,#1C1C1E);background-size:cover;background-position:center;box-shadow:0 10px 24px rgba(0,0,0,.16),0 1px 2px rgba(0,0,0,.12)}
.cc::before{content:"";position:absolute;inset:0;background:radial-gradient(130% 120% at 100% 0%,rgba(255,255,255,.2),rgba(255,255,255,0) 55%);pointer-events:none}
.cc.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.5));pointer-events:none}
.cc>*{position:relative;z-index:1}
.cc:active{transform:scale(.985)}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cc-name{font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.2)}
.cc-top svg{width:24px;height:24px;opacity:.9;flex:none}
.cc-chip{width:40px;height:30px;border-radius:6px;margin-top:14px;background:linear-gradient(135deg,#E9DDBE,#B9A57A)}
.cc-num{position:absolute!important;left:20px;top:58%;font-size:16px;letter-spacing:.12em;font-variant-numeric:tabular-nums;opacity:.92;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.cc-bottom{position:absolute!important;left:20px;right:20px;bottom:16px}
.cc-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:12px;opacity:.95;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.cc-row b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.cc-row span:last-child{text-align:right}
.cc-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.28);margin-top:8px;overflow:hidden}
.cc-bar i{display:block;height:100%;background:#fff;border-radius:2px}
.cc-stats{max-width:400px;margin:10px 0 0;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--label2);padding:0 4px}
.cc-stats b{color:var(--label);font-weight:600;font-variant-numeric:tabular-nums}
.cc-empty{display:grid;place-items:center;aspect-ratio:1.586;max-width:400px;border-radius:16px;border:2px dashed var(--label3);color:var(--label2);font-size:15px;text-align:center;padding:20px;width:100%}
.cc-empty b{display:block;color:var(--tint-text);font-size:17px;margin-top:6px}

/* =========================================================
   PROJETOS (notas com foto)
   ========================================================= */
.pcard{display:block;width:calc(100% - 32px);margin:12px 16px 0;background:var(--card);border-radius:14px;overflow:hidden;text-align:left;box-shadow:0 0 0 .5px var(--grid),0 2px 8px rgba(0,0,0,.05)}
.pcard:active{opacity:.8}
.pcover{position:relative;height:150px;background:var(--pc,#30B0C7);display:grid;place-items:center;color:rgba(255,255,255,.9)}
.pcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcover svg{width:48px;height:48px}
.pcover .pc-tag{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:600;padding:4px 9px;border-radius:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pbody{padding:14px 16px 16px}
.pbody h3{font-size:19px;font-weight:700}
.pbody .pdates{font-size:13px;color:var(--label2);margin-top:2px}
.pbody .pnums{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:15px;font-variant-numeric:tabular-nums}
.phero{margin:6px 16px 0;border-radius:14px;overflow:hidden}
.phero .pcover{height:190px}
.phero .pcover h1{position:absolute;left:16px;right:16px;bottom:14px;color:#fff;font-size:28px;font-weight:700;text-shadow:0 1px 12px rgba(0,0,0,.35);z-index:1}
.phero .pcover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.45))}

/* Controle segmentado */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 16px}
.seg button{flex:1;height:32px;border-radius:7px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--segon);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.seg-label{padding:22px 16px 8px;font-size:13px;color:var(--label2)}

/* Boas-vindas, exemplo e avisos */
.welcome{margin:12px 16px 0;padding:20px;border-radius:14px;background:var(--tint-soft);text-align:center}
.welcome-icon{width:56px;height:56px;border-radius:14px;background:var(--tint);color:var(--on-tint);display:grid;place-items:center;font-weight:700;font-size:22px;margin:0 auto 12px}
.welcome h2{font-size:20px;font-weight:700}
.welcome p{margin-top:6px;color:var(--label2);font-size:15px;line-height:1.4}
.primary-small{display:inline-block;margin-top:14px;background:var(--tint);color:var(--on-tint);font-weight:600;font-size:15px;border-radius:20px;padding:10px 18px}
.primary-small:active{opacity:.7}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 16px 8px;padding:10px 14px;border-radius:12px;background:var(--tint-soft);font-size:15px}
.banner button{color:var(--tint-text);font-weight:600;white-space:nowrap;min-height:32px}
.callout{margin:16px 16px 0;padding:16px;border-radius:12px;background:var(--fill);text-align:center}
.callout p{color:var(--label2);font-size:15px}
.wide-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 32px);margin:0 16px;min-height:50px;border-radius:12px;background:var(--tint-soft);color:var(--tint-text);font-weight:600}
.wide-btn svg{width:20px;height:20px}
.wide-btn:active{opacity:.6}

/* =========================================================
   BARRA DE FERRAMENTAS (abas) E BOTÃO DE ESCREVER
   ========================================================= */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{display:flex;max-width:680px;margin:0 auto}
.tab{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#999;font-size:10px;font-weight:500;letter-spacing:.01em}
@media (prefers-color-scheme: dark){.tab{color:#8a8a8e}}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--tint-text)}
.fab{position:fixed;z-index:25;right:max(16px, calc(50% - 324px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);width:56px;height:56px;border-radius:28px;
  background:var(--tint);color:var(--on-tint);display:grid;place-items:center;box-shadow:0 6px 16px rgba(180,130,0,.3),0 1px 3px rgba(0,0,0,.12);transition:transform .15s}
.fab svg{width:25px;height:25px}
.fab:active{transform:scale(.9)}

/* =========================================================
   FOLHA QUE SOBE DE BAIXO (sheet) E FORMULÁRIOS
   ========================================================= */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .3s}
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 12px);max-width:680px;margin:0 auto;background:var(--sheetbg);border-radius:14px 14px 0 0;
  display:flex;flex-direction:column;overflow:hidden;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.25,1);box-shadow:0 -2px 20px rgba(0,0,0,.12)}
.sheet-wrap.show .scrim{opacity:1}
.sheet-wrap.show .sheet{transform:none}
.grabber{flex:none;width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0}
.sheet-head{position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;height:46px;padding:0 6px}
.sheet-head h2{position:absolute;left:96px;right:96px;text-align:center;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px 0 calc(28px + env(safe-area-inset-bottom))}
.sheet .group{background:var(--sheetcard);border-radius:12px;margin:0 16px;overflow:hidden}
.amount-wrap{text-align:center;padding:10px 16px 16px}
.amount-label{display:block;font-size:13px;color:var(--label2);margin-bottom:2px}
.amount{width:100%;border:0;background:none;outline:none;padding:0;text-align:center;color:var(--label);font:inherit;font-size:44px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;caret-color:var(--tint)}
.amount-hint{font-size:15px;color:var(--label2);margin-top:2px;font-variant-numeric:tabular-nums;min-height:20px}
.field{position:relative;display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px}
.field+.field{border-top:.5px solid var(--sep)}
.field>label{flex:none;display:flex;align-items:center;gap:6px;font-size:17px;max-width:62%}
.field input:not([type=checkbox]){flex:1;min-width:0;border:0;background:none;outline:none;color:var(--label);font:inherit;font-size:17px;text-align:right;padding:13px 0;-webkit-appearance:none;appearance:none;caret-color:var(--tint)}
.field input::placeholder{color:var(--label3)}
.field.full input:not([type=checkbox]){text-align:left}
.field input[type=date]{display:flex;justify-content:flex-end;min-height:24px}
.field input[type=date]::-webkit-date-and-time-value{text-align:right}
.field.sw>label{flex:1;max-width:none}
.switch{-webkit-appearance:none;appearance:none;position:relative;flex:none;width:51px;height:31px;margin:0;border-radius:16px;background:var(--fill2);cursor:pointer;transition:background-color .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .22s cubic-bezier(.3,1.3,.5,1)}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(20px)}
.form-label{display:flex;align-items:center;gap:6px;padding:20px 32px 7px;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.form-label .opt{text-transform:none;letter-spacing:0;color:var(--label3)}
.hint{padding:7px 32px 0;font-size:13px;color:var(--label2)}
.hint.warn{color:var(--red-t)}
.note{padding:8px 32px 0;font-size:13px;color:var(--label2);line-height:1.4}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.type{display:flex;flex-direction:column;gap:2px;min-height:84px;padding:12px;text-align:left;border-radius:12px;background:var(--sheetcard);border:2px solid transparent;transition:border-color .15s,background-color .15s}
.type svg{width:24px;height:24px;color:var(--tint-text);margin-bottom:5px}
.type span{font-size:16px;font-weight:600}
.type small{font-size:13px;color:var(--label2)}
.type.on{border-color:var(--tint);background:var(--tint-soft)}
.type:active{transform:scale(.98)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 2px;scrollbar-width:none;scroll-padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip,.cchip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:5px 13px 5px 6px;border-radius:19px;background:var(--sheetcard);font-size:15px;border:2px solid transparent;white-space:nowrap}
.chip{padding:5px 13px}
.chip.on,.cchip.on{border-color:var(--tint);background:var(--tint-soft);font-weight:600}
.chip .swd{width:14px;height:14px;border-radius:4px;flex:none}
.suggest{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 0;scrollbar-width:none}
.suggest::-webkit-scrollbar{display:none}
.suggest:empty{display:none}
.sug{flex:none;background:var(--sheetcard);color:var(--tint-text);border-radius:17px;padding:8px 13px;font-size:15px;white-space:nowrap}
.statuses{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.st{display:flex;align-items:center;gap:6px}
.st-btn{flex:1;min-height:44px;border-radius:10px;background:var(--sheetcard);font-size:15px;font-weight:500;border:2px solid transparent}
.st-btn.on{border-color:var(--tint);background:var(--tint-soft)}
.swatches{display:flex;flex-wrap:wrap;gap:12px;padding:4px 16px 0}
.swatch{width:36px;height:36px;border-radius:50%;background:var(--sw);position:relative}
.swatch.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2.5px solid var(--tint)}
.cover-pick{margin:0 16px;border-radius:12px;overflow:hidden}
.cover-pick .pcover{height:150px}
.pill-btns{display:flex;gap:10px;padding:10px 16px 0}
.pill-btns>*{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:10px;background:var(--sheetcard);color:var(--tint-text);font-size:15px;font-weight:500;cursor:pointer}
.pill-btns svg{width:19px;height:19px}
.pill-btns .danger{color:var(--red)}
.preview-cc{padding:6px 16px 4px}
.icon-row{display:flex;align-items:center;gap:14px;padding:12px 16px}
.icon-row .tile{width:48px;height:48px;border-radius:13px}
.icon-row .tile svg{width:26px;height:26px}
.ir-txt{min-width:0}
.ir-txt span{display:block;font-weight:600}
.ir-txt small{display:block;font-size:13px;color:var(--label2);margin-top:2px}
.glyphs{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;padding:12px 16px 16px}
.glyph{height:46px;border-radius:12px;display:grid;place-items:center;color:var(--label);background:var(--fill)}
.glyph svg{width:24px;height:24px}
.glyph.on{background:var(--tint);color:var(--on-tint)}
.primary-btn{display:block;width:calc(100% - 32px);height:50px;margin:26px 16px 0;border-radius:12px;background:var(--tint);color:var(--on-tint);font-size:17px;font-weight:600}
.primary-btn:disabled{opacity:.35;cursor:default}
.primary-btn:not(:disabled):active{opacity:.75}
.danger-btn{display:block;width:calc(100% - 32px);height:50px;margin:12px 16px 0;border-radius:12px;background:var(--sheetcard);color:var(--red);font-size:17px}

/* Ajuda "?", aviso rápido e confirmação */
.help{position:relative;flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--tint-soft);color:var(--tint-text);font-size:13px;font-weight:700;letter-spacing:0;text-transform:none;line-height:1}
.help::before{content:"";position:absolute;inset:-12px}
.bubble{position:fixed;z-index:120;max-width:290px;padding:10px 13px;border-radius:12px;background:var(--bubble);color:#fff;font-size:15px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(-4px);transition:opacity .18s,transform .18s;pointer-events:none}
.bubble.show{opacity:1;transform:none}
.toast{position:fixed;z-index:110;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 88px);display:flex;align-items:center;gap:16px;max-width:calc(100% - 32px);padding:12px 16px;border-radius:14px;
  background:rgba(30,30,32,.95);color:#fff;font-size:15px;white-space:nowrap;opacity:0;transform:translate(-50%,10px);transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#FFD60A;font-weight:600;min-height:28px}
.alert-wrap{position:fixed;inset:0;z-index:130;display:grid;place-items:center;background:rgba(0,0,0,.35);opacity:0;transition:opacity .2s}
.alert-wrap.show{opacity:1}
.alert{width:270px;border-radius:14px;background:var(--alertbg);text-align:center;overflow:hidden;transform:scale(1.12);transition:transform .22s}
.alert-wrap.show .alert{transform:none}
.alert h4{padding:19px 16px 2px;font-size:17px;font-weight:600}
.alert p{padding:3px 16px 19px;font-size:13px;line-height:1.35}
.alert-btns{display:flex;border-top:.5px solid var(--sep)}
.alert-btns button{flex:1;height:44px;font-size:17px;color:var(--tint-text)}
.alert-btns button+button{border-left:.5px solid var(--sep)}
.alert-btns .bold{font-weight:600}
.alert-btns .danger{color:var(--red);font-weight:600}

@media (min-width:560px){.mgrid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="nav-in">
    <div id="navLeft"></div>
    <div class="nav-title" id="navTitle" aria-hidden="true"></div>
    <div id="navRight"></div>
  </div>
</header>

<main id="view"></main>

<button class="fab" id="fab" data-act="fab" aria-label="Adicionar"></button>

<nav class="tabbar" aria-label="Seções do app">
  <div class="tabbar-in" id="tabbar" role="tablist"></div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* =========================================================
   ÍCONES (todos desenhados aqui, em SVG simples)
   ========================================================= */
const svg = (p, w = 1.9) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  home: svg('<path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/>'),
  mes: svg('<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
  cards: svg('<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 14.5h3"/>'),
  projects: svg('<path d="M3 13.5 10 11l2-7.5h2l-.5 7 7 2v2l-7-.8-.7 4.3 2.2 1.5v1.5L12 20l-3 1v-1.5l2.2-1.5-.7-4.3L3 15.5z"/>', 1.6),
  more: svg('<path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>', 2.4),
  plusSmall: svg('<path d="M12 6v12M6 12h12"/>', 2.2),

const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pctOf = (a, b) => b > 0 ? Math.min(100, Math.round(a / b * 100)) : 0;
function clampInt(v, min, max, def) { const n = parseInt(v, 10); return isNaN(n) ? def : Math.min(max, Math.max(min, n)); }
function todayKey() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseKey(k) { const [y, m] = k.split('-').map(Number); return { y, m }; }
function addMonths(k, n) {
  let { y, m } = parseKey(k); m += n;
  y += Math.floor((m - 1) / 12); m = (((m - 1) % 12) + 12) % 12 + 1;
  return y + '-' + pad(m);
}
function diffMonths(a, b) { const A = parseKey(a), B = parseKey(b); return (B.y - A.y) * 12 + (B.m - A.m); }
function monthName(k) { const { y, m } = parseKey(k); return cap(fmtMonthName.format(new Date(y, m - 1, 1))); }
function monthLabel(k) { return monthName(k) + ' ' + parseKey(k).y; }
function monthLong(k) { return monthName(k).toLowerCase() + ' de ' + parseKey(k).y; }
function monthShort(k) { const { y, m } = parseKey(k); return MES_CURTO[m - 1] + '/' + y; }
function isoToDate(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
const fmtDate = iso => iso ? fmtDay.format(isoToDate(iso)) : '';
const fmtDateShort = iso => iso ? fmtDayShort.format(isoToDate(iso)).replace('.', '') : '';
function parseDecimal(v) {
  v = String(v || '').trim(); if (!v) return 0;
  v = v.includes(',') ? v.replace(/\./g, '').replace(',', '.') : v;
  const n = parseFloat(v); return isNaN(n) ? 0 : n;
}

function projMonthItems(k, onlyCounted = true) {
  const out = [];
  S.projects.forEach(p => { if (onlyCounted && p.count === false) return; (p.items || []).forEach(x => { if (x.date && x.date.slice(0, 7) === k) out.push({ p, x, cents: toBRL(p, x.amt) }); }); });
  return out;
}

function monthTotals(k) {
  const m = month(k); let out = 0, paid = 0, inc = 0, rec = 0;
  m.bills.forEach(b => { out += b.cents; if (b.paid) paid += b.cents; });
  activeInst(k).forEach(i => { out += i.cents; if (paidIn(i, k)) paid += i.cents; });
  activeSubs(k).forEach(s => { out += s.cents; if (paidIn(s, k)) paid += s.cents; });
  projMonthItems(k).forEach(o => { out += o.cents; paid += o.cents; });
  m.incomes.forEach(x => { inc += x.cents; if (x.received) rec += x.cents; });
  return { out, paid, inc, rec, left: inc - out };
}
/* Para onde foi o dinheiro: soma por categoria */
function catSpend(k) {
  const map = new Map(), add = (cat, c) => map.set(cat, (map.get(cat) || 0) + c);
  month(k).bills.forEach(b => add(itemCat(b), b.cents));
  activeInst(k).forEach(i => add(itemCat(i, 'compras'), i.cents));
  activeSubs(k).forEach(s => add(itemCat(s, 'assinaturas'), s.cents));
  projMonthItems(k).forEach(o => add(itemCat(o.x, 'viagem'), o.cents));
  return [...map.entries()].map(([cat, cents]) => ({ cat, cents })).sort((a, b) => b.cents - a.cents);
}
/* Cartão: o que caiu na fatura do mês e quanto do limite está usado */
function cardItems(id, k) {
  const out = [];
  month(k).bills.filter(b => b.cardId === id).forEach(b => out.push({ type: 'bill', it: b, cents: b.cents }));
  activeInst(k).filter(i => i.cardId === id).forEach(i => out.push({ type: 'inst', it: i, cents: i.cents }));
  activeSubs(k).filter(s => s.cardId === id).forEach(s => out.push({ type: 'sub', it: s, cents: s.cents }));
  projMonthItems(k, false).filter(o => o.x.cardId === id).forEach(o => out.push({ type: 'pitem', it: o.x, p: o.p, cents: o.cents }));
  return out;
}
function cardUsage(c, k) {
  const fatura = sum(cardItems(c.id, k));
  const paid = !!(c.paidFatura && c.paidFatura[k]);
  const future = S.installments.filter(i => i.cardId === c.id).reduce((a, i) => {
    const n = instNum(i, k); const rest = n < 1 ? i.total : Math.max(0, i.total - n);
    return a + rest * i.cents;
  }, 0);
  const used = (paid ? 0 : fatura) + future;
  return { fatura, paid, future, used, free: Math.max(0, (c.limit || 0) - used), pct: pctOf(used, c.limit || 0) };
}
function isAppEmpty() {
  return !Object.values(S.months).some(m => (m.bills || []).length || (m.incomes || []).length)
    && !S.installments.length && !S.subs.length && !S.receivables.length && !S.debts.length && !S.cards.length && !S.projects.length;
}

function findItem(type, id) {
  const k = ui.view;
  switch (type) {
    case 'bill': return month(k).bills.find(x => x.id === id) || Object.values(S.months).flatMap(m => m.bills || []).find(x => x.id === id);
    case 'income': return month(k).incomes.find(x => x.id === id) || Object.values(S.months).flatMap(m => m.incomes || []).find(x => x.id === id);
    case 'inst': return S.installments.find(x => x.id === id);
    case 'sub': return S.subs.find(x => x.id === id);
    case 'recv': return S.receivables.find(x => x.id === id);
    case 'debt': return S.debts.find(x => x.id === id);
    case 'pitem': return S.projects.flatMap(p => p.items || []).find(x => x.id === id);
  }
}
const projOfItem = id => S.projects.find(p => (p.items || []).some(x => x.id === id));
function removeItem(type, id) {
  const f = a => a.filter(x => x.id !== id);
  if (type === 'bill') Object.values(S.months).forEach(m => { m.bills = f(m.bills || []); });
  else if (type === 'income') Object.values(S.months).forEach(m => { m.incomes = f(m.incomes || []); });
  else if (type === 'inst') S.installments = f(S.installments);
  else if (type === 'sub') S.subs = f(S.subs);
  else if (type === 'recv') S.receivables = f(S.receivables);
  else if (type === 'debt') S.debts = f(S.debts);
  else if (type === 'pitem') S.projects.forEach(p => { p.items = f(p.items || []); });
  else if (type === 'card') { S.cards = f(S.cards); [...Object.values(S.months).flatMap(m => m.bills), ...S.installments, ...S.subs, ...S.projects.flatMap(p => p.items || [])].forEach(x => { if (x.cardId === id) delete x.cardId; }); }
  else if (type === 'proj') { S.projects = f(S.projects); S.receivables.forEach(r => { if (r.projectId === id) delete r.projectId; }); }
}
function deleteItem(type, id, label = 'Apagado') {
  const snap = JSON.stringify(S);
  removeItem(type, id);
  if ((type === 'card' || type === 'proj') && ui.page) { ui.page = null; ui.anim = 'pop'; }
  commit();
  toast(label, { label: 'Desfazer', fn: () => { S = JSON.parse(snap); commit(); } });
}
function applyToggle(type, id) {
  const it = findItem(type, id); if (!it) return; const k = ui.view;
  switch (type) {
    case 'bill': it.paid = !it.paid; break;
    case 'income': it.received = !it.received; break;
    case 'inst': case 'sub': it.paid = it.paid || {}; if (it.paid[k]) delete it.paid[k]; else it.paid[k] = true; break;
    case 'recv': it.done = !it.done; break;
    case 'debt': if (it.status === 'paga') it.status = it.prev || 'aberto'; else { it.prev = it.status; it.status = 'paga'; } break;
  }
}
function copyRecurring(from, to) {
  const a = month(from), b = month(to, true); let n = 0;
  a.bills.filter(x => x.kind !== 'compra' && x.recurring).forEach(x => {
    if (!b.bills.some(y => norm(y.name) === norm(x.name))) { b.bills.push({ ...x, id: uid(), paid: false }); n++; }
  });
  a.incomes.filter(x => x.recurring).forEach(x => {
    if (!b.incomes.some(y => norm(y.name) === norm(x.name) && y.day === x.day)) { b.incomes.push({ ...x, id: uid(), received: false }); n++; }
  });
  return n;
}

   ========================================================= */
function barPath(x, y, w, h, r) {
  if (h <= 0.5) return '';
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
/* Últimos N meses, terminando no mês atual */
function rangeData(n) {
  const now = todayKey();
  return Array.from({ length: n }, (_, i) => { const k = addMonths(now, i - n + 1); const t = monthTotals(k); return { k, ...t, has: !!(t.inc || t.out) }; });
}
function chartSVG(data) {
  const n = data.length, W = 340, H = 176, L = 36, R = 4, T = 10, B = 24, pw = W - L - R, ph = H - T - B, slot = pw / n;
  const bw = n <= 6 ? 14 : 8, gap = n <= 6 ? 3 : 2;
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.out)));
  const step = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / step) * step;
  const yv = v => T + ph - (v / top) * ph;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras com o que entrou e o que saiu nos últimos ${n} meses">`;
  [0, .5, 1].forEach(f => { const y = yv(top * f); s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="ax" x="0" y="${y + 3.5}">${f ? 'R$ ' + compact.format(top * f / 100) : '0'}</text>`; });
  data.forEach((d, i) => {
    const cx = L + slot * i + slot / 2, sel = d.k === ui.chartSel, m = parseKey(d.k).m;
    if (sel) s += `<rect class="band" x="${cx - slot / 2 + 1}" y="${T - 4}" width="${slot - 2}" height="${ph + 4}" rx="8"/>`;
    s += `<path class="b-in" d="${barPath(cx - bw - gap / 2, yv(d.inc), bw, T + ph - yv(d.inc), 4)}"/>`;
    s += `<path class="b-out" d="${barPath(cx + gap / 2, yv(d.out), bw, T + ph - yv(d.out), 4)}"/>`;
    s += `<text class="mx ${sel ? 'sel' : ''}" x="${cx}" y="${H - 6}">${n <= 6 ? MES_CURTO[m - 1] : MES_LETRA[m - 1]}</text>`;
    s += `<rect class="hit" data-act="chartPick" data-k="${d.k}" x="${cx - slot / 2}" y="0" width="${slot}" height="${H}"><title>${monthName(d.k)}: entrou ${fmt(d.inc)}, saiu ${fmt(d.out)}</title></rect>`;
  });
  return s + '</svg>';
}
/* =========================================================
   BUSCA: encontra qualquer gasto, em qualquer mês
   ========================================================= */
function searchResults(q) {
  const n = norm(q); if (!n) return '';
  const has = s => norm(s).includes(n), rows = [], spent = [];
  Object.keys(S.months).sort().reverse().forEach(k => {
    const m = month(k), when = `${monthName(k)} ${parseKey(k).y}`;
    m.bills.forEach(b => { if (!has(b.name)) return; spent.push(b);
      rows.push(row({ type: 'bill', id: b.id, check: false, title: b.name, tile: itemTile(b), sub: `<span>${when}</span><span>${b.paid ? 'Pago' : 'Falta pagar'}</span>`, value: fmt(b.cents) })); });
    m.incomes.forEach(x => { if (!has(x.name)) return;
      rows.push(row({ type: 'income', id: x.id, check: false, title: x.name, tile: incomeTile(x.name), sub: `<span>${when}</span><span>${x.received ? 'Recebido' : 'Falta receber'}</span>`, value: '+ ' + fmt(x.cents), valueClass: 'pos' })); });
  });
  S.installments.forEach(i => { if (has(i.name)) rows.push(row({ type: 'inst', id: i.id, check: false, title: i.name, tile: itemTile(i, 'compras'), sub: `<span>Parcelado em ${i.total}x</span><span>Até ${monthShort(addMonths(i.start, i.total - 1))}</span>`, value: fmt(i.cents), value2: 'por mês' })); });
  S.subs.forEach(x => { if (has(x.name)) rows.push(row({ type: 'sub', id: x.id, check: false, title: x.name, tile: itemTile(x, 'assinaturas'), sub: `<span>Assinatura · todo dia ${x.day}</span>`, value: fmt(x.cents), value2: 'por mês' })); });
  S.projects.forEach(p => (p.items || []).forEach(x => { if (!has(x.desc) && !has(p.name)) return; const c = toBRL(p, x.amt); spent.push({ cents: c });
    rows.push(row({ type: 'pitem', id: x.id, check: false, title: x.desc, tile: itemTile(x, 'viagem'), sub: `<span>${esc(p.name)}</span><span>${fmtDateShort(x.date)}</span>`, value: fmt(c) })); }));
  S.receivables.forEach(r => { if (has(r.person) || has(r.desc)) rows.push(row({ type: 'recv', id: r.id, check: false, title: `${r.person}: ${r.desc || 'sem descrição'}`, tile: tile('user', '#FF9500'), sub: `<span>${r.done ? 'Já recebeu' : 'Te deve'}</span>`, value: fmt(r.cents) })); });
  S.debts.forEach(d => { if (has(d.creditor)) rows.push(row({ type: 'debt', id: d.id, check: false, title: d.creditor, tile: itemTile({ name: d.creditor }, 'financeiro'), sub: `<span>Dívida · ${statusOf(d.status).label}</span>`, value: fmt(d.cents) })); });
  if (!rows.length) return `<div class="callout"><p>Nada encontrado para “${esc(q)}”.</p></div>`;
  const total = spent.length > 1 ? `<div class="math">Gasto com isso: = <span class="res">${fmt(sum(spent))}</span></div>` : '';
  return section(countLabel(rows.length, 'resultado', 'resultados'), rows.slice(0, 80).join(''), { key: 'busca', math: total, foot: 'Toque em um item para ver ou mudar.' });
}

    <div id="sres">${searchResults(q)}</div><div id="hbody" ${q ? 'hidden' : ''}>` + banner();

  if (isAppEmpty()) h += `<div class="welcome"><div class="welcome-icon">R$</div><h2>Olá! Esta é a sua nota de contas.</h2>
    <p>É como a lista que você fazia no Notas, só que ela faz as contas sozinha. Toque no botão amarelo para anotar o primeiro gasto.</p>
    <button class="primary-small" data-act="seed">Ver um exemplo</button></div>`;

  /* Mês atual, fixado no topo como uma nota fixada */
  h += `<div class="pinned">${ICON.pin}Fixada · ${monthLabel(now)}</div>
  <div class="duo">
    <button class="panel tap" data-act="openMonth" data-k="${now}" aria-label="Falta pagar ${fmt(faltaPagar)}. Abrir o mês">
      <span class="p-label">Falta pagar</span>
      <span class="p-big"><span class="hl orange">${fmt(faltaPagar)}</span></span>
      ${t.out && !faltaPagar ? `<span class="stamp">${ICON.stamp}Tudo pago</span>`
        : `${progress(pctOf(t.paid, t.out))}<div class="small muted mt6">${t.out ? `Já pagou ${fmt(t.paid)} de ${fmt(t.out)}` : 'Nada anotado ainda'}</div>`}</button>
    <button class="panel tap" data-act="openMonth" data-k="${now}" aria-label="Falta receber ${fmt(faltaReceber)}. Abrir o mês">
      <span class="p-label">Falta receber</span>
      <span class="p-big"><span class="hl mint">${fmt(faltaReceber)}</span></span>
      ${t.inc && !faltaReceber ? `<span class="stamp">${ICON.stamp}Tudo recebido</span>`
        : `${progress(pctOf(t.rec, t.inc), 'blue')}<div class="small muted mt6">${t.inc ? `Já recebeu ${fmt(t.rec)} de ${fmt(t.inc)}` : 'Nada anotado ainda'}</div>`}</button>
  </div>
  <div class="math">Sobrou: ${num(t.inc)} − ${num(t.out)} = <span class="res ${t.left < 0 ? 'neg' : ''}">${fmt(t.left)}</span></div>
  <div class="sec-foot">Entrou menos o que saiu em ${monthName(now).toLowerCase()}. Toque nos valores para abrir o mês.</div>`;

  /* Gráfico dos últimos meses */
  let chart = `<div class="chart-wrap"><div class="chart-head"><div class="legend"><span><i class="dot" style="background:var(--c-in)"></i>Entrou</span><span><i class="dot" style="background:var(--c-out)"></i>Saiu</span></div>
    <button class="mini-link" data-act="chartTable">${ui.chartTable ? 'Ver gráfico' : 'Ver tabela'}</button></div>
    <div class="seg mt" style="margin-left:0;margin-right:0" role="group" aria-label="Período"><button data-act="range" data-n="6" aria-pressed="${ui.range === 6}">6 meses</button><button data-act="range" data-n="12" aria-pressed="${ui.range === 12}">12 meses</button></div>`;
  chart += ui.chartTable
    ? `<table class="ctbl"><thead><tr><th scope="col">Mês</th><th scope="col">Entrou</th><th scope="col">Saiu</th><th scope="col">Sobrou</th></tr></thead><tbody>
      ${data.map(d => `<tr><td>${MES_CURTO[parseKey(d.k).m - 1]}</td><td>${fmt(d.inc)}</td><td>${fmt(d.out)}</td><td class="${d.left < 0 ? 'neg' : ''}">${fmt(d.left)}</td></tr>`).join('')}</tbody></table>`
    : `<div class="readout"><strong>${monthName(sel.k)}</strong> · entrou <strong>${fmt(sel.inc)}</strong> · saiu <strong>${fmt(sel.out)}</strong></div>${chartSVG(data)}<div class="small muted">Toque em um mês para ver os valores.</div>`;
  chart += `<div class="math" style="padding-left:0">Em ${ui.range} meses: ${num(tIn)} − ${num(tOut)} = <span class="res ${tIn - tOut < 0 ? 'neg' : ''}">${fmt(tIn - tOut)}</span></div></div>`;
  h += section('Últimos meses', chart, { key: 'home:grafico', summary: `Entrou ${fmt(tIn)} · saiu ${fmt(tOut)}` });

  /* Cada mês como uma nota, na visualização em galeria */
  h += section('Meses', `<div class="mgrid">${[...data].reverse().map(d => `
    <button class="mcard ${d.k === now ? 'now' : ''} ${d.has ? '' : 'empty'}" data-act="openMonth" data-k="${d.k}" aria-label="${monthName(d.k)}: entrou ${fmt(d.inc)}, saiu ${fmt(d.out)}, sobrou ${fmt(d.left)}">
      <span class="mc-name"><span>${monthName(d.k)}</span>${d.k === now ? ICON.pin : ''}</span>
      <span class="mc-line"><span><i class="dot" style="background:var(--c-in)"></i>Entrou</span><span>${num(d.inc)}</span></span>
      <span class="mc-line"><span><i class="dot" style="background:var(--c-out)"></i>Saiu</span><span>${num(d.out)}</span></span>
      <span class="mc-line total"><span>Sobrou</span><span class="${d.left < 0 ? 'neg' : ''}">= ${num(d.left)}</span></span>
      <span class="mc-date">${MES_CURTO[parseKey(d.k).m - 1]}. de ${parseKey(d.k).y}</span>
    </button>`).join('')}</div>`, { key: 'home:meses' });

  const cats = catSpend(now), totalC = cats.reduce((a, c) => a + c.cents, 0);
  if (cats.length) {
    const topC = cats.slice(0, 6), rest = cats.slice(6).reduce((a, c) => a + c.cents, 0);
    if (rest) topC.push({ cat: 'outros', cents: rest, merged: true });
    h += section(`Para onde foi o dinheiro`, topC.map(c => { const cat = catById(c.cat), p = pctOf(c.cents, totalC); return `
      <div class="catrow">${tile(cat.icon, cat.color)}<div class="cat-main"><div class="cat-top"><span>${c.merged ? 'Outras coisas' : cat.label}</span><span>${fmt(c.cents)}</span></div>
      <div class="cat-bar"><i style="width:${p}%;background:${cat.color}"></i></div><div class="cat-pct">${p}% do que saiu em ${monthName(now).toLowerCase()}</div></div></div>`; }).join(''),
      { key: 'home:categorias', summary: `Maior gasto: ${catById(cats[0].cat).label}` });
  }
  return h + '</div>';
}

/* =========================================================
   ABA 2: MÊS
   ========================================================= */
function billRow(b) {
  const cat = catById(itemCat(b)), sub = [`<span>${cat.label}</span>`];
  if (b.cardId && cardById(b.cardId)) sub.push(`<span>${esc(cardName(b.cardId))}</span>`);
  if (b.kind !== 'compra' && b.recurring) sub.push('<span>Todo mês</span>');
  if (b.payTo) sub.push(`<span>Para ${esc(b.payTo)}</span>`);
  if (b.pix) sub.push(`<button class="pix" data-act="copy" data-text="${esc(b.pix)}" aria-label="Copiar chave PIX de ${esc(b.name)}">Copiar PIX</button>`);
  return row({ type: 'bill', id: b.id, done: b.paid, title: b.name, tile: itemTile(b), sub: sub.join(''), value: fmt(b.cents) });
}
function instRow(i, k) {
  const n = instNum(i, k), end = addMonths(i.start, i.total - 1);
  const sub = `<span>Parcela ${n} de ${i.total}</span><span>${n === i.total ? 'Última' : 'Até ' + monthShort(end)}</span>${i.cardId && cardById(i.cardId) ? `<span>${esc(cardName(i.cardId))}</span>` : ''}`;
  return row({ type: 'inst', id: i.id, done: paidIn(i, k), title: i.name, tile: itemTile(i, 'compras'), value: fmt(i.cents), sub });
}
function incomeRow(x) {
  return row({ type: 'income', id: x.id, done: x.received, title: x.name, tile: incomeTile(x.name),
    checkLabel: x.received ? 'Marcar como não recebido' : 'Marcar como recebido',
    sub: (x.day ? `<span>Dia ${x.day}</span>` : '') + (x.recurring ? '<span>Todo mês</span>' : ''), value: '+ ' + fmt(x.cents), valueClass: 'pos' });
}
function viewMes() {
  const k = ui.view, m = month(k), t = monthTotals(k);
  const fixas = m.bills.filter(b => b.kind !== 'compra'), compras = m.bills.filter(b => b.kind === 'compra');
  const inst = activeInst(k), subs = activeSubs(k), incomes = [...m.incomes].sort((a, b) => (a.day || 99) - (b.day || 99));
  const pct = pctOf(t.paid, t.out), falta = t.out - t.paid;
  const closedSum = list => list.length ? `${countLabel(list.length, 'item', 'itens')} · ${fmt(sum(list))}` : 'Vazio';

  let h = noteDate() + `<div class="large">${monthSwitch(true)}</div>` + banner();
  h += `<div class="panel"><span class="p-label">Sobrou</span><span class="p-big"><span class="hl ${t.left < 0 ? 'pink' : 'blue'}">${fmt(t.left)}</span></span>
    ${t.left < 0 ? '<div class="alert-line">Saiu mais do que entrou neste mês.</div>' : ''}
    <div class="p-grid"><div><span class="p-label"><i class="dot" style="background:var(--c-in)"></i>Entrou</span><b>${fmt(t.inc)}</b></div>
      <div><span class="p-label"><i class="dot" style="background:var(--c-out)"></i>Saiu</span><b>${fmt(t.out)}</b></div></div>
    <div class="divider"></div>
    <div class="rb"><span class="p-label">Já pago</span><span class="small muted">${pct}%</span></div>
    <div class="paid-line"><strong>${fmt(t.paid)}</strong> de ${fmt(t.out)}</div>
    ${t.out && !falta ? `<span class="stamp">${ICON.stamp}Tudo pago</span>` : progress(pct)}
    ${falta > 0 ? `<div class="small muted mt6">Falta pagar ${fmt(falta)}</div>` : ''}</div>`;
  h += copyCallout(k);

  h += section('Entradas', incomes.length ? incomes.map(incomeRow).join('') : emptyBtn('Nenhuma entrada neste mês.', 'income'),
    { add: 'income', label: 'Entradas', math: mathLine('Total', incomes), summary: closedSum(incomes) });
  h += section('Contas do mês', fixas.length ? fixas.map(billRow).join('') : emptyBtn('Nenhuma conta ainda.', 'conta'),
    { add: 'conta', math: mathLine('Total', fixas), summary: closedSum(fixas) });
  h += section('Compras', compras.length ? compras.map(billRow).join('') : emptyBtn('Nenhuma compra ainda.', 'compra'),
    { add: 'compra', math: mathLine('Total', compras), summary: closedSum(compras) });
  h += section('Compras parceladas', inst.length ? noteTable(['O quê?', 'Quanto?', 'Parcela'], inst.map(i => instTr(i, k)).join('')) : emptyBtn('Nenhuma compra parcelada.', 'parc'),
    { add: 'parc', math: mathLine('Parcelas do mês', inst), summary: closedSum(inst) });

  const subsPaid = subs.filter(s => paidIn(s, k)).length;
  let more = navRow({ act: 'open', data: 'data-tab="more" data-page="subs"', tile: tile('repeat', '#32ADE6'), title: 'Assinaturas',
    sub: subs.length ? `${subsPaid} de ${subs.length} já cobradas` : 'Nenhuma anotada', value: fmt(sum(subs)) });
  const pm = projMonthItems(k), byP = new Map();
  pm.forEach(o => byP.set(o.p.id, (byP.get(o.p.id) || 0) + o.cents));
  byP.forEach((c, id) => { const p = projById(id), n = pm.filter(o => o.p.id === id).length;
    more += navRow({ data: `data-tab="projects" data-page="proj:${id}"`, tile: projThumb(p), title: esc(p.name), sub: `${countLabel(n, 'gasto', 'gastos')} neste mês`, value: fmt(c) }); });
  h += section('Também neste mês', more, { foot: byP.size ? 'Os gastos de projetos já estão somados no que saiu.' : '' });

  const withCard = S.cards.map(c => ({ c, u: cardUsage(c, k) })).filter(o => o.u.fatura);
  if (withCard.length) h += section('Faturas dos cartões', withCard.map(o => navRow({ data: `data-tab="cards" data-page="card:${o.c.id}"`,
    tile: tile('card', o.c.color), title: esc(o.c.name), sub: o.u.paid ? 'Fatura paga' : (o.c.dueDay ? `Vence dia ${o.c.dueDay}` : 'Ainda não paga'), value: fmt(o.u.fatura) })).join(''),
    { help: helpBtn(HELP.cartaoNoMes), foot: 'As compras dessas faturas já estão nas listas acima.' });

  const next = addMonths(k, 1);
  h += `<section class="sec"><button class="wide-btn" data-act="startNext">${ICON.arrowR}<span>Começar ${monthName(next).toLowerCase()}</span></button>
    <div class="sec-foot">Leva as contas fixas e as entradas de todo mês para ${monthName(next).toLowerCase()}, ainda sem marcar como pagas. Parcelas e assinaturas vão sozinhas.</div></section>`;
  return h;
}

/* =========================================================
   ABA 3: CARTÕES
   ========================================================= */
function viewCards() {
  const k = ui.view;
  let h = `<div class="large"><h1>Cartões</h1>${monthSwitch(false)}</div>` + banner();
  if (!S.cards.length) {
    return h + `<div class="ccwrap"><button class="cc-empty" data-act="fab"><span>Cadastre seus cartões para ver o limite e quanto já gastou.<b>Adicionar cartão</b></span></button></div>`;
  }
  S.cards.forEach(c => {
    const u = cardUsage(c, k);
    h += `<div class="ccwrap">${ccFace(c, k, { tag: 'button', attrs: `data-act="open" data-tab="cards" data-page="card:${c.id}" aria-label="Abrir ${esc(c.name)}"` })}
      <div class="cc-stats"><span>Fatura de ${monthName(k).toLowerCase()}: <b>${fmt(u.fatura)}</b>${u.paid ? ' · paga' : ''}</span><span>Disponível: <b>${fmt(u.free)}</b></span></div></div>`;
  });
  return h + `<div class="sec-foot" style="margin-top:14px">Os desenhos são só ilustrativos. Toque em um cartão para ver as compras.</div>`;
}
function pageCard(id) {
  const c = cardById(id); if (!c) { ui.page = null; return viewCards(); }
  const k = ui.view, u = cardUsage(c, k), items = cardItems(id, k);
  let h = `<div class="large"><h1>${esc(c.name)}</h1>${monthSwitch(false)}</div>`;
  h += `<div class="ccwrap">${ccFace(c, k)}</div>`;
  h += `<div class="sec"><div class="group">
    <div class="info-row"><span class="ir-l">Fatura de ${monthName(k).toLowerCase()}</span><span class="ir-v"><b>${fmt(u.fatura)}</b></span></div>
    <div class="info-row"><span class="ir-l">Fatura paga</span><input type="checkbox" class="switch" role="switch" data-act="toggleFatura" data-id="${c.id}" ${u.paid ? 'checked' : ''} aria-label="Fatura paga"></div>
    <div class="info-row"><span class="ir-l">Limite usado ${helpBtn(HELP.limiteUsado)}</span><span class="ir-v">${fmt(u.used)} de ${fmt(c.limit || 0)}</span></div>
    <div class="info-row"><span class="ir-l">Disponível</span><span class="ir-v pos">${fmt(u.free)}</span></div>
    ${u.future ? `<div class="info-row"><span class="ir-l">Parcelas que ainda vão vir</span><span class="ir-v">${fmt(u.future)}</span></div>` : ''}
    ${c.closeDay || c.dueDay ? `<div class="info-row"><span class="ir-l">Fecha ${helpBtn(HELP.fechamento)}</span><span class="ir-v">${c.closeDay ? 'dia ' + c.closeDay : '—'} · vence ${c.dueDay ? 'dia ' + c.dueDay : '—'}</span></div>` : ''}
  </div><div style="padding:0 16px">${progress(u.pct, u.pct >= 90 ? 'warn' : 'blue')}</div></div>`;
  const rows = items.map(o => {
    if (o.type === 'pitem') return row({ type: 'pitem', id: o.it.id, check: false, title: o.it.desc || 'Gasto', tile: itemTile(o.it, 'viagem'),
      sub: `<span>${esc(o.p.name)}</span><span>${fmtDateShort(o.it.date)}</span>`, value: fmt(o.cents), value2: o.p.currency !== 'BRL' ? fmtCur(o.it.amt, o.p.currency) : '' });
    if (o.type === 'inst') return instRow(o.it, k);
    if (o.type === 'sub') return row({ type: 'sub', id: o.it.id, done: paidIn(o.it, k), title: o.it.name, tile: itemTile(o.it, 'assinaturas'), sub: `<span>Assinatura · dia ${o.it.day}</span>`, value: fmt(o.it.cents) });
    return billRow(o.it);
  }).join('');
  h += section('Compras nesta fatura', rows || emptyBtn('Nenhuma compra neste cartão no mês.', 'compra', `data-card="${c.id}"`), { add: 'compra', addExtra: `data-card="${c.id}"`, label: c.name });

/* =========================================================
   ABA 4: PROJETOS
   ========================================================= */
function viewProjects() {
  let h = `<div class="large"><h1>Projetos</h1><p class="lead">Viagens e metas com orçamento próprio.</p></div>` + banner();
  if (!S.projects.length) return h + `<div class="callout"><p>Crie um projeto, como uma viagem, para juntar os gastos num lugar só. Dá para escolher a moeda e colocar uma foto.</p>
    <button class="primary-small" data-act="fab">Criar projeto</button></div>`;
  S.projects.forEach(p => {
    const st = projStats(p), [code, , flag] = curInfo(p.currency);
    const dates = [p.start && fmtDate(p.start), p.end && fmtDate(p.end)].filter(Boolean).join(' a ');
    h += `<button class="pcard" data-act="open" data-tab="projects" data-page="proj:${p.id}" aria-label="Abrir ${esc(p.name)}">

        <div class="pnums"><span><b>${fmtCur(st.spent, p.currency)}</b>${p.budget ? ` de ${fmtCur(p.budget, p.currency)}` : ''}</span>${p.currency !== 'BRL' ? `<span class="muted">≈ ${fmt(st.brl)}</span>` : ''}</div>
        ${p.budget ? progress(st.pct, st.over ? 'warn' : 'blue') : ''}</div></button>`;
  });
  return h;
}
function pageProject(id) {
  const p = projById(id); if (!p) { ui.page = null; return viewProjects(); }
  const st = projStats(p), cur = p.currency, rest = (p.budget || 0) - st.spent;
  const items = [...(p.items || [])].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  let h = `<div class="phero">${projCover(p, { title: true })}</div>`;
  h += `<div class="panel"><div class="rb"><span class="p-label">Gasto até agora</span>${cur !== 'BRL' ? `<span class="small muted">≈ ${fmt(st.brl)}</span>` : ''}</div>
    <span class="p-big">${fmtCur(st.spent, cur)}</span>
    ${p.budget ? `${progress(st.pct, st.over ? 'warn' : 'blue')}<div class="small mt6 ${st.over ? 'neg' : 'muted'}">${st.over ? 'Passou ' + fmtCur(-rest, cur) + ' do orçamento' : 'Falta ' + fmtCur(rest, cur) + ' de ' + fmtCur(p.budget, cur)}</div>` : '<div class="small muted mt6">Sem orçamento definido.</div>'}
    ${cur !== 'BRL' ? `<div class="divider"></div><div class="rb small"><span class="muted" style="display:flex;align-items:center;gap:6px">Cotação ${helpBtn(HELP.cotacao)}</span><span>1 ${cur} = R$ ${String(p.rate || 0).replace('.', ',')}</span></div>` : ''}
    ${p.count === false ? '<div class="small muted mt6">Não entra no total dos meses.</div>' : ''}</div>`;

  const cats = new Map(); items.forEach(x => { const c = itemCat(x, 'viagem'); cats.set(c, (cats.get(c) || 0) + x.amt); });
  if (cats.size > 1) h += section('Por categoria', [...cats.entries()].sort((a, b) => b[1] - a[1]).map(([c, v]) => { const cat = catById(c), pc = pctOf(v, st.spent); return `
    <div class="catrow">${tile(cat.icon, cat.color)}<div class="cat-main"><div class="cat-top"><span>${cat.label}</span><span>${fmtCur(v, cur)}</span></div>
    <div class="cat-bar"><i style="width:${pc}%;background:${cat.color}"></i></div></div></div>`; }).join(''));

  h += section('Gastos', items.length ? items.map(x => row({ type: 'pitem', id: x.id, check: false, title: x.desc || 'Gasto', tile: itemTile(x, 'viagem'),
      sub: `<span>${catById(itemCat(x, 'viagem')).label}</span>${x.date ? `<span>${fmtDateShort(x.date)}</span>` : ''}${x.cardId && cardById(x.cardId) ? `<span>${esc(cardName(x.cardId))}</span>` : ''}`,
      value: fmtCur(x.amt, cur), value2: cur !== 'BRL' ? '≈ ' + fmt(toBRL(p, x.amt)) : '' })).join('')
    : emptyBtn('Nenhum gasto ainda.', 'pitem', `data-pid="${p.id}"`), { add: 'pitem', addExtra: `data-pid="${p.id}"`, label: 'Gastos' });

  const recv = S.receivables.filter(r => r.projectId === p.id);
  h += section('Quem te deve', (recv.length ? recv.map(recvRow).join('') : '') +
    `<button class="add-row" data-act="add" data-preset="recv" data-pid="${p.id}">${ICON.plusSmall}<span>Adicionar alguém que te deve</span></button>`,
    { foot: recv.length ? `Falta receber ${fmt(sum(recv.filter(r => !r.done)))}` : '' });
  return h;
}

  h += section('Papel', `<div class="seg" role="group" aria-label="Fundo do papel">
      <button data-act="paper" data-v="liso" aria-pressed="${paper === 'liso'}">Liso</button><button data-act="paper" data-v="linhas" aria-pressed="${paper === 'linhas'}">Com linhas</button><button data-act="paper" data-v="grade" aria-pressed="${paper === 'grade'}">Quadriculado</button></div>`,
    { key: 'mais:papel', foot: 'Igual ao Notas: escolha o fundo das suas notas.' });

/* Assinaturas */
function daysUntil(day) {
  const now = new Date(), today = now.getDate(), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(), d = Math.min(day, dim);
  if (d >= today) return d - today;
  return (dim - today) + Math.min(day, new Date(now.getFullYear(), now.getMonth() + 2, 0).getDate());
}
function dueBadge(s, k) {
  if (k !== todayKey() || paidIn(s, k)) return '';
  const now = new Date(), today = now.getDate(), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(), d = Math.min(s.day, dim);
  if (d < today) return `<span class="badge red">Venceu dia ${s.day}</span>`;
  const n = d - today;
  if (n === 0) return '<span class="badge orange">Vence hoje</span>';
  if (n === 1) return '<span class="badge orange">Vence amanhã</span>';
  if (n <= 3) return `<span class="badge orange">Vence em ${n} dias</span>`;
  return '';
}
function pageSubs() {
  const k = ui.view, subs = activeSubs(k).slice().sort((a, b) => daysUntil(a.day) - daysUntil(b.day));
  const total = sum(subs), paidN = subs.filter(s => paidIn(s, k)).length;
  let h = `<div class="large"><h1>Assinaturas</h1>${monthSwitch(false)}</div>`;
  h += `<div class="panel"><span class="p-label">Total por mês</span><span class="p-big">${fmt(total)}</span>
    <div class="small muted mt6">${subs.length ? `Pagas em ${monthName(k).toLowerCase()}: ${paidN} de ${subs.length}` : 'Nenhuma assinatura cadastrada.'}</div>
    ${subs.length ? progress(pctOf(paidN, subs.length)) : ''}</div>`;
  h += section('Suas assinaturas', subs.length ? subs.map(s => row({ type: 'sub', id: s.id, done: paidIn(s, k), title: s.name, tile: itemTile(s, 'assinaturas'), value: fmt(s.cents),
    sub: `<span>Todo dia ${s.day}</span>${s.cardId && cardById(s.cardId) ? `<span>${esc(cardName(s.cardId))}</span>` : ''}${dueBadge(s, k)}` })).join('')
    : emptyBtn('Nenhuma assinatura ainda.', 'assin'), { add: 'assin', foot: subs.length ? 'Toque no círculo quando a cobrança passar no mês.' : '' });
  return h;
}

const STATUS = [

const statusOf = id => STATUS.find(s => s.id === id) || STATUS[0];
function motivation(p, any) {

  if (p >= 100) return 'Tudo quitado. Parabéns!'; if (p >= 75) return 'Quase lá. Falta pouco!';

function debtRow(x) {

/* =========================================================
   FOLHA (sheet), AVISOS, CONFIRMAÇÕES E AJUDA
   ========================================================= */
let SH = null;
function openSheet(o) {
  if (SH) { SH.w.remove(); SH = null; }
  const w = document.createElement('div');
  w.className = 'sheet-wrap';
  w.innerHTML = `<div class="scrim" data-sheet="close"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(o.title)}"><div class="grabber" aria-hidden="true"></div>
      <header class="sheet-head"><button class="link" data-sheet="close">Cancelar</button><h2>${esc(o.title)}</h2>
        <button class="link strong" data-sheet="save">${o.saveLabel || 'Salvar'}</button></header>
      <div class="sheet-body">${o.body}</div></div>`;
  document.body.appendChild(w);
  document.documentElement.classList.add('locked');
  const sheet = w.querySelector('.sheet');
  SH = { ...o, w, sheet };
  SH.refresh = () => { const can = o.canSave ? !!o.canSave(sheet) : true; w.querySelectorAll('[data-sheet="save"]').forEach(b => { b.disabled = !can; }); };
  w.addEventListener('input', () => SH && SH.refresh());
  w.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); e.target.blur(); } });
  if (o.onMount) o.onMount(sheet);
  SH.refresh();
  enableSheetDrag(sheet);
  void w.offsetHeight; w.classList.add('show');
}
function closeSheet() {
  if (!SH) return;
  const s = SH; SH = null;
  if (document.activeElement && s.w.contains(document.activeElement)) document.activeElement.blur();
  s.sheet.style.transform = ''; s.w.classList.remove('show');
  document.documentElement.classList.remove('locked');
  setTimeout(() => s.w.remove(), 340);
}
function enableSheetDrag(sheet) {
  let y0 = null, dy = 0;
  sheet.querySelectorAll('.grabber,.sheet-head').forEach(z => z.addEventListener('touchstart', e => {
    if (e.target.closest('button')) return; y0 = e.touches[0].clientY; dy = 0; sheet.style.transition = 'none';
  }, { passive: true }));
  sheet.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sheet.style.transform = `translateY(${dy}px)`; }, { passive: true });
  sheet.addEventListener('touchend', () => { if (y0 === null) return; y0 = null; sheet.style.transition = ''; if (dy > 110) closeSheet(); else sheet.style.transform = ''; });
}

let toastTimer;
function toast(msg, action) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  if (action) el.querySelector('button').onclick = () => { hideToast(); action.fn(); };
  el.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 5000 : 2400);
}
function hideToast() { $('#toast').classList.remove('show'); }

function askConfirm({ title, message = '', ok = 'OK', cancel = 'Cancelar', danger = false }) {
  return new Promise(res => {
    const w = document.createElement('div');

    w.innerHTML = `<div class="alert" role="alertdialog" aria-modal="true" aria-labelledby="al-t"><h4 id="al-t">${esc(title)}</h4><p>${esc(message)}</p>
      <div class="alert-btns"><button data-r="0">${esc(cancel)}</button><button data-r="1" class="${danger ? 'danger' : 'bold'}">${esc(ok)}</button></div></div>`;

let bubble = null, bubbleFor = null;
function showHelp(btn) {
  if (bubbleFor === btn) { hideHelp(); return; }
  hideHelp();
  const b = document.createElement('div');
  b.className = 'bubble'; b.setAttribute('role', 'tooltip'); b.textContent = btn.dataset.help;
  document.body.appendChild(b);
  const r = btn.getBoundingClientRect(), w = Math.min(290, innerWidth - 32);
  b.style.width = 'max-content'; b.style.maxWidth = w + 'px';
  const bw = b.offsetWidth, bh = b.offsetHeight;
  let top = r.bottom + 10; if (top + bh > innerHeight - 90) top = r.top - bh - 10;
  b.style.left = Math.min(Math.max(16, r.left + r.width / 2 - bw / 2), innerWidth - 16 - bw) + 'px'; b.style.top = top + 'px';
  requestAnimationFrame(() => b.classList.add('show'));
  bubble = b; bubbleFor = btn;
}
function hideHelp() { if (bubble) { const b = bubble; b.classList.remove('show'); setTimeout(() => b.remove(), 200); } bubble = null; bubbleFor = null; }

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  toast('PIX copiado');
}

function attachSuggest(sh, inputId, boxId, items, onPick, showAmount = true) {

<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Contas">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#FFFFFF">
<title>Minhas Contas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FFFFFF'/%3E%3Cpath d='M28 52l14 14 30-32' fill='none' stroke='%232B59FF' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* =========================================================
   CORES — claro é o padrão; escuro e automático são opcionais
   ========================================================= */
:root{
  --bg:#FFFFFF; --ink:#1D1D1F; --muted:#6E6E73; --faint:#AEAEB2; --line:#E5E5EA; --soft:#F5F5F7;
  --pen:#2B59FF; --pen-soft:rgba(43,89,255,.09); --good:#1E8E5A; --bad:#D63A3A; --warn:#C96A00;
  --c-in:#2B59FF; --c-out:#E08A00;          /* gráfico: cores testadas para daltonismo */
  --sheet:#FFFFFF; --bar:rgba(255,255,255,.94); --shade:rgba(0,0,0,.32);
  --num:ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, sans-serif;
  --tabh:56px;
  color-scheme:light;
}
html[data-theme="escuro"]{
  --bg:#000000; --ink:#F5F5F7; --muted:#98989D; --faint:#636366; --line:#2C2C2E; --soft:#1C1C1E;
  --pen:#5B7CFF; --pen-soft:rgba(91,124,255,.16); --good:#3CC48A; --bad:#FF6B6B; --warn:#FF9F0A;
  --c-in:#5B7CFF; --c-out:#D9730D; --sheet:#1C1C1E; --bar:rgba(0,0,0,.9); --shade:rgba(0,0,0,.6);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#000000; --ink:#F5F5F7; --muted:#98989D; --faint:#636366; --line:#2C2C2E; --soft:#1C1C1E;
    --pen:#5B7CFF; --pen-soft:rgba(91,124,255,.16); --good:#3CC48A; --bad:#FF6B6B; --warn:#FF9F0A;
    --c-in:#5B7CFF; --c-out:#D9730D; --sheet:#1C1C1E; --bar:rgba(0,0,0,.9); --shade:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}

/* =========================================================
   BASE
   ========================================================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
html.locked,html.locked body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,[role=button]:focus-visible,label:focus-within{outline:2px solid var(--pen);outline-offset:3px;border-radius:6px}
h1,h2,h3,p{margin:0;font-weight:inherit}
img{display:block;max-width:100%}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}

.screen{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(var(--tabh) + env(safe-area-inset-bottom) + 110px)}
.screen.push{animation:slide .28s cubic-bezier(.2,.85,.25,1)}
@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

/* Topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.title{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;margin-left:-6px;padding-right:8px;color:var(--pen);font-size:17px}
.back svg{width:22px;height:22px}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:22px;color:var(--ink)}
.ibtn svg{width:22px;height:22px}
.ibtn:active,.back:active{opacity:.4}
.lead{margin-top:6px;color:var(--muted);font-size:15px;max-width:34em}

/* Troca de mês */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px}
.h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.monthpick{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.15;cursor:pointer}
.monthpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;-webkit-appearance:none;appearance:none;font-size:16px}
.monthpick svg{width:16px;height:16px;color:var(--faint);margin-top:6px}
.arrows{display:flex;gap:4px}
.arrows button{width:40px;height:40px;border-radius:20px;background:var(--soft);display:grid;place-items:center}
.arrows svg{width:18px;height:18px}
.arrows button:active{opacity:.5}
.today-link{display:inline-block;margin-top:4px;color:var(--pen);font-size:15px;min-height:32px}

/* =========================================================
   NÚMEROS PRINCIPAIS
   ========================================================= */
.hero{margin-top:28px}
.hero-label{font-size:15px;color:var(--muted)}
.hero-value{display:block;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:48px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-done{display:flex;align-items:center;gap:10px;font-size:34px;font-weight:700;letter-spacing:-.025em;margin-top:4px;color:var(--pen)}
.hero-done svg{width:34px;height:34px}
.progress{height:4px;border-radius:2px;background:var(--line);margin-top:14px;overflow:hidden}
.progress i{display:block;height:100%;border-radius:2px;background:var(--pen);transition:width .5s cubic-bezier(.2,.85,.25,1)}
.progress-text{margin-top:8px;font-size:15px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
button.kv{text-align:left}
.kv span:first-child{color:var(--muted);font-size:17px}
.kv b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;white-space:nowrap}
.kvs{margin-top:22px;border-top:1px solid var(--line)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.trio span{display:block;font-size:13px;color:var(--muted)}
.trio b{display:block;margin-top:2px;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* =========================================================
   BLOCOS E LISTAS
   ========================================================= */
.block{margin-top:40px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.block-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.link{color:var(--pen);font-size:15px;min-height:36px;display:inline-flex;align-items:center}
.link:active{opacity:.5}
.link.small{font-size:14px;gap:4px;margin-top:6px;min-height:32px}
.list{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 0;border-bottom:1px solid var(--line)}
.item-text{flex:1;min-width:0;cursor:pointer}
.item-name{display:flex;align-items:center;gap:8px;font-size:17px;white-space:nowrap;overflow:hidden}
.item-name .nm{overflow:hidden;text-overflow:ellipsis;position:relative}
.item-sub{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:2px;font-size:13px;color:var(--muted)}
.item-val{flex:none;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:17px;font-weight:500;white-space:nowrap;text-align:right}
.item-val small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.glyph{flex:none;width:18px;height:18px;color:var(--faint);display:grid;place-items:center}
.glyph svg{width:18px;height:18px}
.glyph img{width:20px;height:20px;border-radius:5px;object-fit:cover}
.pixbtn{position:relative;display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;background:var(--pen-soft);color:var(--pen);font-size:12.5px;font-weight:600}
.pixbtn.danger{background:rgba(255,59,48,.1);color:var(--bad)}
.tile b small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.pixbtn::before{content:"";position:absolute;inset:-2px -4px -8px}
/* Ícone pequeno na frente do nome, como os ícones dos Ajustes do iPhone */
.ico{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;background:var(--ic,#AEAEB2)}
.ico svg{width:17px;height:17px}
.ico img{width:28px;height:28px;border-radius:7px;object-fit:cover;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
.item-name{gap:10px}
.est{color:var(--c-out);font-weight:700;margin-left:2px}
.est-label{color:var(--c-out)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-right:-20px;padding-right:20px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none;white-space:nowrap}
.f-amount:focus-visible,.kv-edit input.money:focus-visible{outline:none}
.chip svg{width:16px;height:16px}
.catrow{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 0;border-bottom:1px solid var(--line);text-align:left}
.catrow:active{opacity:.6}
.cat-pct{flex:none;width:38px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:600;color:var(--ink)}
.pill.est-pill{color:var(--c-out)}
.cat-main{flex:1;min-width:0}
.cat-top{display:flex;justify-content:space-between;gap:8px;font-size:16px}
.cat-top b{font-family:var(--num);font-weight:500}
.cat-bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.cat-bar i{display:block;height:100%;background:var(--ink);opacity:.45;border-radius:2px}
.catrow.on .cat-bar i{background:var(--pen);opacity:1}
.filter{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding:8px 14px;border-radius:12px;background:var(--pen-soft);font-size:15px}
.callbox{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:15px}
.late{color:var(--bad)}
.soon{color:var(--c-out)}

/* Marcar como pago: um traço de caneta, e o nome fica riscado */
.tick{position:relative;flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;transition:border-color .2s,transform .15s}
.tick::before{content:"";position:absolute;inset:-10px}
.tick svg{width:18px;height:18px;overflow:visible}
.tick path{fill:none;stroke:var(--pen);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24}
.tick.on{border-color:var(--pen)}
.tick.on path{stroke-dashoffset:0}
.just .tick.on path{animation:draw .35s ease-out}
.tick:active{transform:scale(.88)}
.item.done .item-name,.item.done .item-val{color:var(--muted)}
.item.done .nm::after{content:"";position:absolute;left:0;right:0;top:54%;height:1.6px;border-radius:1px;background:var(--pen);opacity:.75}
.just.done .nm::after{transform-origin:left;animation:strike .35s ease-out}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.total{display:flex;justify-content:space-between;padding:14px 0 0;font-size:15px;color:var(--muted)}
.total b{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--ink);font-size:17px;font-weight:600}
.empty{padding:22px 0;color:var(--muted);font-size:15px;border-bottom:1px solid var(--line)}
.empty button{color:var(--pen)}
.note{margin-top:12px;font-size:13px;color:var(--muted)}

/* Abas Saídas / Entradas */
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--soft);margin-top:28px}
.seg button{flex:1;height:38px;border-radius:9px;font-size:15px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04)}
html[data-theme="escuro"] .seg button[aria-pressed="true"]{background:#3A3A3C}

/* Gráfico */
.readout{font-size:15px;color:var(--muted);min-height:22px}
.readout b{color:var(--ink);font-weight:600;font-family:var(--num)}
.legend{display:flex;gap:16px;margin-top:6px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{display:block;width:100%;height:auto;margin-top:10px}
.chart .in{fill:var(--c-in)} .chart .out{fill:var(--c-out)}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .lbl{font-size:12px;fill:var(--muted);text-anchor:middle;font-family:-apple-system,sans-serif}
.chart .lbl.sel{fill:var(--ink);font-weight:700}
.chart .hit{fill:transparent;cursor:pointer}
.chart .dim{opacity:.35}

/* Lista de meses */
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.mrow:active{opacity:.55}
.mrow .m-name{font-size:17px;font-weight:600}
.mrow .m-sub{display:flex;flex-wrap:wrap;column-gap:10px;row-gap:0;margin-top:2px;font-size:13px;color:var(--muted)}
.mrow .m-sub>span{white-space:nowrap}
.mrow .m-val{margin-left:auto;text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;white-space:nowrap}
.mrow .m-val small{display:block;font-size:12px;color:var(--muted);font-weight:400;font-family:-apple-system,sans-serif}
.mrow.slim{min-height:52px}
/* Aviso de fatura fechada */
.reminds{margin-top:22px;display:grid;gap:8px}
.remind{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--pen-soft)}
.remind:active{opacity:.6}
.remind .r-t{flex:1;min-width:0}
.remind .r-t b{display:block;font-size:15px;font-weight:600}
.remind .r-t span{display:block;font-size:13px;color:var(--muted)}
.chart .fut{fill-opacity:.4}
.lg-fut{color:var(--faint)}
/* Início: quadradinhos */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.tile{display:block;text-align:left;padding:12px 14px;border-radius:14px;background:var(--soft);min-width:0}
.tile>span{display:block;font-size:13px;color:var(--muted)}
.tile b{display:block;margin-top:2px;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.tile:active{opacity:.6}
.tile .t-sub{display:block;margin-top:1px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.t-good{background:rgba(52,199,89,.12)} .tile.t-good b{color:var(--good)}
.tile.t-warn{background:rgba(255,149,0,.13)} .tile.t-warn b{color:var(--warn)}
.tile.t-bad{background:rgba(255,59,48,.11)} .tile.t-bad b{color:var(--bad)}
.tiles.three{grid-template-columns:repeat(3,1fr)} .tiles.three .tile{padding:10px 11px} .tiles.three .tile b{font-size:16px}
/* pessoas */
.av{flex:none;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--pc,#5AC8FA);color:#fff;font-weight:700;font-size:17px}
.pixrow{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:15px;color:var(--muted)}
.hamb{display:inline-grid;place-items:center;width:40px;height:40px;margin-left:-8px;color:var(--ink)}
.hamb svg{width:24px;height:24px}
/* Gasto no cartão: cartãozinho no lugar da bolinha */
.cardmark{flex:none;width:28px;height:28px;display:grid;place-items:center;color:var(--faint)}
.cardmark svg{width:20px;height:20px}
.cardmark.sm{width:18px;height:18px}.cardmark.sm svg{width:16px;height:16px}
.note-card{display:flex;gap:8px;align-items:flex-start}
.mrow.now .m-name::after{content:"este mês";margin-left:8px;font-size:12px;font-weight:500;color:var(--pen)}

/* Menu da aba Mais */
.menu{border-top:1px solid var(--line)}
.mi{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);text-align:left;font-size:17px;cursor:pointer}
.mi:active{opacity:.55}
.mi svg.ic{width:22px;height:22px;color:var(--ink);flex:none}
.mi .mi-t{flex:1;min-width:0}
.mi .mi-s,.switch-row .mi-s,.kv .mi-s{display:block;font-size:13px;color:var(--muted)}
.mi .mi-v{color:var(--muted);font-family:var(--num);font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.chev{width:14px;height:14px;color:var(--faint);flex:none}
.mrow .chev{margin-left:4px;align-self:center}
.mi.danger{color:var(--bad)} .mi.danger svg.ic{color:var(--bad)}

/* Cartões e projetos */
.ccmini{flex:none;width:44px;height:28px;border-radius:5px;background:var(--cc);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.cc{position:relative;width:100%;max-width:360px;aspect-ratio:1.586;border-radius:16px;padding:18px 20px;color:#fff;background:var(--cc);margin-top:22px;overflow:hidden}
.cc::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,0) 45%);pointer-events:none}
.cc .cc-name{font-size:18px;font-weight:600}
.cc .cc-digits{position:absolute;left:20px;bottom:56px;font-family:var(--num);letter-spacing:.12em;opacity:.9}
.cc .cc-foot{position:absolute;left:20px;right:20px;bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;opacity:.95}
.cc .cc-foot b{display:block;font-family:var(--num);font-size:17px;font-weight:600}
.thumb{flex:none;width:44px;height:44px;border-radius:10px;background:var(--pc,var(--soft));overflow:hidden;display:grid;place-items:center;color:#fff}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:22px;height:22px}
.cover{height:170px;border-radius:16px;margin-top:16px;background:var(--pc,var(--soft));overflow:hidden;display:grid;place-items:center;color:#fff}
.cover img{width:100%;height:100%;object-fit:cover}
.cover svg{width:44px;height:44px}
.tagline{display:inline-block;font-size:13px;color:var(--muted)}

/* =========================================================
   BARRA DE BAIXO E BOTÃO +
   ========================================================= */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{display:flex;max-width:600px;margin:0 auto}
.tab{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--faint)}
.tab svg{width:25px;height:25px}
.tab[aria-selected="true"]{color:var(--ink)}
.fab{position:fixed;z-index:31;right:max(20px, calc(50% - 280px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 18px);width:60px;height:60px;border-radius:30px;background:var(--pen);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(43,89,255,.32);transition:transform .15s}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.92)}

/* =========================================================
   FOLHA PARA ADICIONAR / MUDAR
   ========================================================= */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--shade);opacity:0;transition:opacity .28s}
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 16px);max-width:600px;margin:0 auto;background:var(--sheet);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet-wrap.show .scrim{opacity:1}
.sheet-wrap.show .sheet{transform:none}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 12px}
.sheet-head h2{font-size:17px;font-weight:600}
.sheet-head button{min-width:80px;height:44px;font-size:17px;color:var(--muted)}
.sheet-head button:first-child{text-align:left;padding-left:8px}
.sheet-head button.ok{text-align:right;padding-right:8px;color:var(--pen);font-weight:600}
.sheet-head button.ok:disabled{color:var(--faint)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 20px calc(30px + env(safe-area-inset-bottom))}
.f-amount{width:100%;border:0;background:none;outline:none;padding:0;margin-top:18px;color:var(--ink);font-family:var(--num);font-variant-numeric:tabular-nums;font-size:48px;font-weight:700;letter-spacing:-.03em;caret-color:var(--pen)}
.f-hint{font-size:15px;color:var(--muted);min-height:20px}
.f{display:block;margin-top:22px}
.f > span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.f input{display:block;width:100%;border:0;border-bottom:1.5px solid var(--line);background:none;outline:none;padding:8px 0;font:inherit;font-size:19px;color:var(--ink);border-radius:0;-webkit-appearance:none;appearance:none}
.f input:focus{border-bottom-color:var(--pen)}
.f input::placeholder{color:var(--faint)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 15px;border-radius:20px;border:1.5px solid var(--line);font-size:15px;color:var(--ink)}
.chip.on{border-color:var(--pen);color:var(--pen);background:var(--pen-soft);font-weight:600}
.chip .dot{width:12px;height:12px;border-radius:4px}
.chip svg{width:16px;height:16px}
.sug{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.sug::-webkit-scrollbar{display:none}
.sug:empty{display:none}
.sug button{flex:none;min-height:36px;padding:0 13px;border-radius:18px;background:var(--soft);font-size:15px;white-space:nowrap}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;min-height:44px;font-size:17px}
.switch{-webkit-appearance:none;appearance:none;position:relative;flex:none;width:51px;height:31px;margin:0;border-radius:16px;background:var(--line);cursor:pointer;transition:background-color .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .22s cubic-bezier(.3,1.3,.5,1)}
.switch:checked{background:var(--pen)}
.switch:checked::after{transform:translateX(20px)}
.more-btn{display:flex;align-items:center;gap:6px;margin-top:26px;min-height:44px;color:var(--pen);font-size:17px}
.more-btn svg{width:16px;height:16px;transition:transform .2s}
.more-btn[aria-expanded="true"] svg{transform:rotate(90deg)}
.more{padding-bottom:4px}
.sub-h{margin-top:22px;font-size:13px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.swatch{width:36px;height:36px;border-radius:50%;background:var(--sw);position:relative}
.swatch.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--pen)}
.glyphs{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:10px}
.glyphs button{height:44px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.glyphs button svg{width:22px;height:22px}
/* valor com a moeda ao lado */
.amtrow{display:flex;align-items:flex-end;gap:10px}
.amtrow .f-amount{flex:1;min-width:0}
.curbtn{flex:none;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px;margin-bottom:8px;border-radius:18px;background:var(--soft);font-size:15px;font-weight:600;color:var(--ink)}
.curbtn svg{width:14px;height:14px}
/* + contextual: grade de atalhos grandes */
.add-ctx{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:15px;color:var(--muted)}
.add-ctx .dot{width:12px;height:12px;border-radius:4px;flex:none}
.add-ctx svg,.ctxchip svg{width:16px;height:16px;flex:none}
.addgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.addtile{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:9px;min-height:104px;padding:14px 6px 12px;border-radius:16px;background:var(--soft);color:var(--ink);font-size:14px;font-weight:500;line-height:1.2;text-align:center;transition:transform .12s}
.addtile:active{transform:scale(.95)}
.addtile .ai{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--tc,#2B59FF);color:#fff}
.addtile .ai svg{width:24px;height:24px}
.add-sec{margin-top:24px;font-size:13px;color:var(--muted)}
.ctxchip{display:inline-flex;align-items:center;gap:7px;margin-top:8px;min-height:32px;padding:0 12px;border-radius:16px;background:var(--soft);font-size:14px;font-weight:600;color:var(--ink)}
.ctxchip .dot{width:11px;height:11px;border-radius:3px}
/* linha com valor que dá para editar (extras da fatura) */
.kv.kv-edit{align-items:center}
.kv-edit input.money{width:46%;min-width:130px;text-align:right;border:0;border-bottom:1.5px dashed var(--pen);background:none;outline:none;padding:4px 0;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;color:var(--pen);border-radius:0;-webkit-appearance:none;appearance:none}
.kv-edit input.money:focus{border-bottom-style:solid}
.glyphs button.on{background:var(--pen-soft);color:var(--pen)}
.icon-now{display:flex;align-items:center;gap:12px;margin-top:10px}
.icon-now .ico{width:44px;height:44px;border-radius:11px}
.icon-now .ico svg{width:26px;height:26px}
.icon-now .ico img{width:44px;height:44px;border-radius:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;font-size:17px;font-weight:600}
.btn.primary{margin-top:30px;background:var(--pen);color:#fff}
.btn.primary:disabled{opacity:.35}
.btn.plain{margin-top:10px;color:var(--bad)}
.btn.soft{background:var(--soft);color:var(--ink);font-weight:500;height:46px;font-size:15px}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row > *{flex:1}

/* Grupos por categoria na aba Mês */
.grp{margin-top:26px}
.grp-h{display:flex;align-items:center;gap:10px;padding-bottom:8px;font-size:15px;font-weight:600}
.grp-h .grp-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-h b{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.grp-h .pixbtn{flex:none}
/* Arrastar para a esquerda para apagar */
.swipe{position:relative;overflow:hidden}
.swipe .item{position:relative;z-index:1;background:var(--bg);transition:transform .22s cubic-bezier(.2,.85,.25,1)}
.sw-del{position:absolute;top:0;right:0;bottom:1px;width:88px;background:var(--bad);color:#fff;font-weight:600;font-size:15px}
/* Caixa de rendimento das reservas e da nuvem */
.calc{margin-top:18px;padding:4px 14px;border-radius:14px;background:var(--soft)}
.calc .kv{padding:10px 0}
.calc .kv b{font-size:17px}
.calc h3{font-size:15px;font-weight:600;padding-top:10px}
.f textarea{display:block;width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:10px;background:none;padding:10px;font:inherit;font-size:16px;color:var(--ink);font-family:ui-monospace,Menlo,monospace}
.steps{margin:10px 0 0;padding-left:20px;font-size:15px;line-height:1.5}
.steps li{margin-top:6px}
.steps code{font-size:13px;background:var(--soft);padding:1px 5px;border-radius:5px}

/* Ajuda "?", aviso e confirmação */
.help{position:relative;flex:none;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--soft);color:var(--muted);font-size:12px;font-weight:700;line-height:1}
.help::before{content:"";position:absolute;inset:-13px}
.bubble{position:fixed;z-index:120;max-width:290px;padding:10px 13px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:15px;line-height:1.35;opacity:0;transition:opacity .15s;pointer-events:none}
.bubble.show{opacity:1}
.toast{position:fixed;z-index:110;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 92px);display:flex;align-items:center;gap:16px;max-width:calc(100% - 40px);padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:15px;white-space:nowrap;opacity:0;transform:translate(-50%,8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--pen);font-weight:600;min-height:28px;filter:brightness(1.4)}
.alert-wrap{position:fixed;inset:0;z-index:130;display:grid;place-items:center;background:var(--shade);opacity:0;transition:opacity .2s;padding:24px}
.alert-wrap.show{opacity:1}
.alert{width:100%;max-width:320px;border-radius:18px;background:var(--sheet);padding:22px 20px 16px}
.alert h3{font-size:19px;font-weight:700}
.alert p{margin-top:6px;font-size:15px;color:var(--muted);line-height:1.4}
.alert .btn-row{margin-top:18px}
.alert .btn-col{display:grid;gap:8px;margin-top:18px}
.alert .btn-col .btn{margin:0}
.alert .btn{height:46px;font-size:16px}
.alert .yes{background:var(--pen);color:#fff}
.alert .yes.danger{background:var(--bad)}
.alert .no{background:var(--soft);color:var(--ink);font-weight:500}

/* Relatório para imprimir ou salvar em PDF (só aparece na impressão) */
/* Estética em minúsculas: feita no JavaScript (ver "MINÚSCULAS"), para o R$ ficar em maiúsculo */
input::placeholder,textarea::placeholder{text-transform:lowercase}
#print{display:none;text-transform:none}
@media print{
  @page{margin:16mm}
  html,body{background:#fff!important;color:#000!important}
  body > *:not(#print){display:none!important}
  #print{display:block;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#000;font-size:11pt;line-height:1.4}
  #print h1{font-size:20pt;font-weight:700;margin:0}
  #print .r-date{color:#555;font-size:9.5pt;margin-top:2pt}
  #print h2{font-size:13pt;font-weight:700;margin:18pt 0 6pt}
  #print table{width:100%;border-collapse:collapse}
  #print th,#print td{text-align:left;padding:5pt 4pt;border-bottom:.5pt solid #ccc;vertical-align:top}
  #print th{font-size:9pt;color:#555;font-weight:600}
  #print td.v,#print th.v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  #print tr.t td{font-weight:700;border-bottom:0;border-top:1pt solid #000}
  #print .r-sum{display:grid;grid-template-columns:repeat(5,1fr);gap:8pt;margin-top:14pt}
  #print .r-sum div{border:.5pt solid #ccc;border-radius:4pt;padding:6pt 8pt}
  #print .r-sum span{display:block;font-size:8.5pt;color:#555}
  #print .r-sum b{font-size:12pt}
  #print .r-foot{margin-top:18pt;font-size:8.5pt;color:#777}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>

<div id="print" aria-hidden="true"></div>

<script>
'use strict';

/* =========================================================

const svg = (p, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

/* =========================================================

const PROV_SUG = ['Saúde', 'Remédios', 'Investimento', 'Emergência', 'Viagem', 'Presentes', 'IPVA e impostos', 'Casa'];
const provSince = p => p.since || todayKey();
const activeProvs = k => (S.provisions || []).filter(p => p.monthly > 0 && !p.paused && diffMonths(provSince(p), k) >= 0);
const provBalance = p => isIntl(p) ? Math.round(walletAmt(p) / Math.pow(10, decOf(p.cur)) * walletRate(p) * 100)
  : Object.values(p.paidAmt || {}).reduce((a, c) => a + c, 0) + (p.moves || []).reduce((a, m) => a + m.cents, 0);
const provById = id => (S.provisions || []).find(p => p.id === id);
/* Rendimento pelo CDI, com Imposto de Renda e IOF (renda fixa, como caixinhas e CDBs) */
const CDI_PADRAO = 13.65;   /* CDI ao ano em outubro de 2026. Dá para mudar no app. */
const IOF = [96, 93, 90, 86, 83, 80, 76, 73, 70, 66, 63, 60, 56, 53, 50, 46, 43, 40, 36, 33, 30, 26, 23, 20, 16, 13, 10, 6, 3, 0];
const irRate = d => d <= 180 ? .225 : d <= 360 ? .20 : d <= 720 ? .175 : .15;
const daysBetween = (a, b) => Math.round((isoToDate(b) - isoToDate(a)) / 864e5);
const pctTxt = v => String(Math.round(v * 100) / 100).replace('.', ',');
const aporteDate = (p, k) => k + '-' + pad(Math.min(28, p.aporteDay || 1));
/* Cada aporte é um "lote" com a sua data; o que foi usado sai dos lotes mais antigos */
function provLots(p) {
  const ev = [...Object.entries(p.paidAmt || {}).map(([k, c]) => ({ date: aporteDate(p, k), cents: c })),
    ...(p.moves || []).map(m => ({ date: m.date || todayISO(), cents: m.cents }))].sort((a, b) => a.date.localeCompare(b.date));
  const lots = [];
  ev.forEach(e => { if (e.cents > 0) lots.push({ date: e.date, cents: e.cents }); else { let r = -e.cents; while (r > 0 && lots.length) { const t = Math.min(lots[0].cents, r); lots[0].cents -= t; r -= t; if (!lots[0].cents) lots.shift(); } } });
  return lots;
}
/* Quanto a reserva vale numa data, já tirando IR e IOF. withFuture: soma os aportes mensais que ainda vão acontecer */
function provProject(p, until, withFuture) {
  const a = (S.cdi || CDI_PADRAO) / 100, d = (Math.pow(1 + a, 1 / 252) - 1) * (p.cdiPct || 0) / 100, today = todayISO();

/* =========================================================
   VALOR FINAL DA FATURA
   No dia em que a fatura fecha, você coloca o valor que veio no app do banco.
   O app já sabe os automáticos (assinaturas, parcelas e compras anotadas no cartão);
   o que passar disso vira "Extras" (corridas, iFood e outros gastos soltos).
   ========================================================= */
/* O que já está anotado na fatura, separado: assinaturas, parcelas, compras e estornos */
function fatParts(items) {
  const subs = items.filter(o => !o.extra && (o.type === 'sub' || (o.type === 'bill' && o.it.recurring && o.it.kind !== 'compra' && o.it.kind !== 'estorno')));
  const inst = items.filter(o => o.type === 'inst');
  const credits = items.filter(o => !o.extra && o.credit);
  const buys = items.filter(o => !o.extra && !subs.includes(o) && !inst.includes(o) && !credits.includes(o));
  const extra = items.filter(o => o.extra);
  return { subs, inst, buys, credits, extra };
}
/* Valor da fatura: antes de fechar é "prévia"; depois de fechar, você confirma e ela fica "fechada" */
function openFaturaValue(id, k, paying, focusExtra) {
  const c = cardById(id); if (!c) return;
  const items = cardItems(id, k).filter(o => !o.extra), autos = sum(items), closed = !c.closeDay || isClosed(c, k);
  const fin = finalOf(c, k), pv = prevOf(c, k), mn = monthName(k).toLowerCase();
  const start = fin !== null ? fin : pv !== null ? pv : Math.max(autos, c.prov || 0);
  const P = fatParts(items), line = (l, v, n) => v ? `<div class="kv"><span>${l}${n ? `<span class="mi-s">${n}</span>` : ''}</span><b style="font-size:17px">${fmt(v)}</b></div>` : '';
  const body = `<p class="lead" style="margin-top:8px">${closed
      ? `A fatura de ${mn} do ${esc(c.name)} fechou. Confirme o valor que veio no app do banco.`
      : `A fatura de ${mn} do ${esc(c.name)} ainda não fechou${c.closeDay ? ` (fecha ${fmtDateShort(closeDateOf(c, k))})` : ''}. Se já sabe o valor, lance como prévia: no fechamento é só confirmar.`}</p>
    ${moneyInput('f-amount', start, 'BRL', 'Valor da fatura')}
    <div class="kvs" style="margin-top:10px">${line('Assinaturas e contas fixas', sum(P.subs))}${line('Parcelas', sum(P.inst))}${line('Compras anotadas', sum(P.buys))}${P.credits.length ? line('Estornos', sum(P.credits)) : ''}
      <label class="kv kv-edit"><span id="f-ex-l">Extras e eventuais<span class="mi-s">Uber, ifood, compras soltas. Toque para mudar</span></span>${moneyInput('f-extra', Math.max(0, start - autos), 'BRL', 'Extras e eventuais')}</label></div>
    <p class="note" id="f-ex-warn" hidden>O valor está menor que o que já está anotado no cartão. Confira se alguma assinatura ou parcela não veio nesta fatura.</p>
    <p class="note">Mude o total ou os extras: um acompanha o outro.</p>
    ${closed || paying ? swRow('f-paid', 'Já paguei', !!paying) : ''}`;
  openSheet({ title: closed ? 'Fatura fechada' : 'Prévia da fatura', body,
    canSave: () => true,
    onMount(sh) {
      /* total e extras andam juntos: total = automáticos + extras */
      const tot = $('#f-amount', sh), ex = $('#f-extra', sh);
      const upd = e => {
        if (e && e.target === ex) setC(tot, autos + getC(sh, 'f-extra'));
        else if (!e || e.target === tot) setC(ex, Math.max(0, getC(sh) - autos));
        $('#f-ex-warn', sh).hidden = getC(sh) >= autos;
      };
      sh.addEventListener('input', upd); upd();
      if (focusExtra && !TOUCH) try { ex.focus({ preventScroll: true }); } catch (e) {} else if (!focusExtra) focusAmount(sh);
      if (focusExtra) setTimeout(() => { try { ex.scrollIntoView({ block: 'center' }); } catch (e) {} }, 350);
    },
    onSave(sh) {
      const v = getC(sh);
      c.prev = c.prev || {}; c.fechada = c.fechada || {};
      if (closed) { c.fechada[k] = v; delete c.prev[k]; } else c.prev[k] = v;
      if (!c.prov) c.prov = v;   /* primeira vez: vira a provisão dos próximos meses */
      if ($('#f-paid', sh) && $('#f-paid', sh).checked) setFaturaPaid(id, k, true);
      const t = monthTotals(ui.view);
      commit(); toast(t.out && !t.toPay ? 'Tudo pago neste mês!' : closed ? `Fatura de ${fmt(v)} fechada` : `Prévia de ${fmt(v)} lançada`);
    },
    deleteLabel: 'Tirar o valor',
    onDelete: fin !== null || pv !== null ? () => { delete c.fechada[k]; if (c.prev) delete c.prev[k]; commit(); toast('Valor tirado'); } : null });
}

async function exportBackup() {
  const name = `minhas-contas-${todayISO()}.json`;
  const blob = new Blob([JSON.stringify({ app: 'minhas-contas', version: 3, exportedAt: new Date().toISOString(), data: S }, null, 2)], { type: 'application/json' });
  const done = () => { S.lastBackup = Date.now(); commit(); toast('Cópia salva'); };
  try { const file = new File([blob], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Cópia das contas' }); done(); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); done();
}
function importBackup(file) {
  const r = new FileReader();
  r.onload = async () => {
    let d; try { const j = JSON.parse(r.result); d = j && j.data ? j.data : j; } catch (e) { d = null; }
    if (!d || typeof d !== 'object' || !d.months) { toast('Esse arquivo não é uma cópia das contas.'); return; }
    if (!await askConfirm({ title: 'Abrir esta cópia?', message: 'Os dados de agora serão trocados pelos da cópia.', ok: 'Abrir' })) return;
    S = Object.assign(emptyState(), d); migrate(); applyTheme(); ui.page = null; commit(); toast('Cópia aberta');
  };
  r.onerror = () => toast('Não deu para ler o arquivo.');
  r.readAsText(file);
}

/* Os gastos da viagem ao Japão são dinheiro que VOCÊ deve: passam de "Me devem" para "Eu devo", com parcelas */
function japanToPayables() {
  const trip = S.projects.find(p => norm(p.name).includes('japao')); if (!trip) return;
  const mine = S.receivables.filter(r => r.projectId === trip.id); if (!mine.length) return;
  S.receivables = S.receivables.filter(r => r.projectId !== trip.id);
  S.payables = S.payables || [];
  const groups = new Map(), singles = [];
  mine.forEach(r => {
    const m = /^(.*?)\s*\((\d+)\s*\/\s*(\d+)\)\s*$/.exec(r.desc || '');
    if (!m) { singles.push(r); return; }
    const key = norm(r.person) + '|' + norm(m[1]);
    if (!groups.has(key)) groups.set(key, { base: m[1].trim(), N: +m[3], list: [] });
    groups.get(key).list.push({ r, n: +m[2] });
  });
  groups.forEach(g => {
    const top = g.list.reduce((a, b) => b.n > a.n ? b : a), r = top.r;
    const anchor = g.list.length === 1 && r.done ? '2026-10' : '2026-11', start = addMonths(anchor, -(top.n - 1)), paid = {};
    for (let i = 0; i < top.n - 1; i++) paid[addMonths(start, i)] = true;
    if (r.done) paid[anchor] = true;
    S.payables.push({ id: uid(), person: r.person, pix: r.pix || '', desc: g.base, cents: r.cents, parcels: g.N, start, paid, done: Object.keys(paid).length >= g.N, cat: 'viagem', projectId: trip.id });
  });
  singles.forEach(r => { const o = { id: r.id, person: r.person, pix: r.pix || '', desc: r.desc, cents: r.cents, parcels: 1, paid: {}, done: !!r.done, cat: 'viagem', projectId: trip.id };
    if (!r.done) o.start = '2026-11'; S.payables.push(o); });
}
/* Seus dois investimentos que rendem 120% do CDI */
function seedInvest() {

  const add = (name, reais, re) => {
    const old = S.provisions.find(p => re.test(norm(p.name)));
    if (old) { if (!old.cdiPct) old.cdiPct = 120; return; }
    S.provisions.push({ id: uid(), name, since: todayKey(), monthly: 0, goal: 0, paidAmt: {}, cdiPct: 120,
      moves: [{ id: uid(), date: todayISO(), cents: Math.round(reais * 100), note: 'Valor que já tinha', initial: true }] });
  };

}
/* "Meu Nubank", "Nubank Bela" e "Itaúcard" são faturas: viram cartões. O valor que já estava
   fica como "outras compras do cartão" e tudo que você anotar no cartão soma na fatura. */
function billsToCards() {
  [['Meu Nubank', '#8A05BE'], ['Nubank Bela', '#B24BF3'], ['Itaúcard', '#EC7000']].forEach(([name, color]) => {
    const bills = Object.values(S.months).flatMap(m => m.bills || []).filter(b => norm(b.name) === norm(name) && !b.cardId);
    if (!bills.length) return;
    let c = S.cards.find(x => norm(x.name) === norm(name)) || (name === 'Meu Nubank' && S.cards.find(x => norm(x.name) === 'nubank'));
    if (!c) { c = { id: uid(), name, color, limit: 0, last4: '', paidFatura: {} }; S.cards.push(c); }
    bills.forEach(b => { b.cardId = c.id; b.cardBase = true; });
  });
}
/* Se você já tinha um cartão "Nubank", o "Meu Nubank" criado sozinho vira esse mesmo cartão */
function mergeAutoCards() {
  const auto = S.cards.find(c => norm(c.name) === 'meu nubank' && !c.limit && !c.closeDay && !c.dueDay), mine = S.cards.find(c => norm(c.name) === 'nubank');
  if (!auto || !mine) return;
  [...Object.values(S.months).flatMap(m => m.bills || []), ...S.installments, ...S.subs, ...S.projects.flatMap(p => p.items || [])].forEach(x => { if (x.cardId === auto.id) x.cardId = mine.id; });

/* Modelo novo de fatura (v5): as contas "base" de cada cartão (extras previstos ou valor da fatura)
   viram provisão, prévia ou fatura fechada no próprio cartão — sem mudar o total que você já via. */
function migrateCardsV5() {
  const plans = [];
  Object.keys(S.months).sort().forEach(k => {
    const bases = month(k).bills.filter(b => b.cardBase && b.cardId && cardById(b.cardId)); if (!bases.length) return;
    const L = outItems(k);
    bases.forEach(b => { const c = cardById(b.cardId); plans.push({ c, k, b, autos: sum(L.filter(o => o.card === c.id && !o.extra)) }); });
  });
  plans.forEach(({ c, k, b, autos }) => {
    c.prev = c.prev || {}; c.extraPaid = c.extraPaid || {}; c.fechada = c.fechada || {};
    if (b.paid) c.extraPaid[k] = true;
    if (finalOf(c, k) !== null) return;
    const total = autos + (b.cents || 0);
    if (b.estimate) { c.provCand = total; return; }
    if (b.paid || !c.closeDay || isClosed(c, k)) c.fechada[k] = total; else c.prev[k] = total;

}
/* v6: categorias novas, cadastro de pessoas, tipo dos gastos de viagem e câmbio indo para a reserva internacional */
function migrateV6() {
  const removed = Object.keys(CAT_ALIAS);
  if (S.cats) {
    S.cats = S.cats.filter(c => !(removed.includes(c.id) && (!OLD_LABELS[c.id] || c.label === OLD_LABELS[c.id])));
    const fin = S.cats.find(c => c.id === 'financeiro'); if (fin && fin.label === 'Cartões e bancos') fin.label = 'Cartões';
    const ct = S.cats.find(c => c.id === 'contas'); if (ct && ct.icon === 'bolt') ct.icon = 'house';
  }
  const kept = id => (S.cats || []).some(c => c.id === id);
  const fix = x => { if (x.cat && removed.includes(x.cat) && !kept(x.cat)) { const g = guess(x.name || x.desc); x.cat = g ? g.cat : CAT_ALIAS[x.cat]; } };
  S.installments.forEach(i => { if (i.cat && removed.includes(i.cat) && !kept(i.cat)) i.cat = 'parceladas'; });
  [...Object.values(S.months).flatMap(m => m.bills || []), ...S.subs, ...(S.payables || [])].forEach(fix);
  S.projects.forEach(p => (p.items || []).forEach(x => { if (!x.kind) x.kind = tripKindOf(x.desc, x.cat); }));
  knownPeople().forEach(k => { if (!peopleReg().some(x => norm(x.name) === norm(k.name))) peopleReg().push({ id: uid(), name: k.name, pix: k.pix || '', day: k.day || null }); });
  S.provisions = S.provisions || [];
  S.projects.forEach(p => {
    (p.fx || []).forEach(f => {
      const name = f.note && f.note.trim().length <= 24 ? cap(f.note.trim()) : 'Wise';
      let w = S.provisions.find(x => isIntl(x) && x.cur === f.cur && norm(x.name) === norm(name));
      if (!w) { w = { id: uid(), name, cur: f.cur, since: (f.date || todayISO()).slice(0, 7), paidAmt: {}, moves: [], monthly: 0, goal: 0 }; S.provisions.push(w); }
      w.moves.push({ id: f.id || uid(), date: f.date || todayISO(), cents: f.brl || 0, amt: f.amt || 0, fx: true, note: '', projectId: p.id });
      if (!p.walletId) p.walletId = w.id;
    });
    delete p.fx;
  });
}
function migrate() {
  S.payables = S.payables || []; S.provisions = S.provisions || [];
  if (!S.cats || !S.cats.length) S.cats = defaultCats();
  defaultCats().forEach(c => { if (!S.cats.some(x => x.id === c.id)) S.cats.push(c); });
  if (!S.cdi) S.cdi = CDI_PADRAO;
  S.provisions.forEach(p => (p.moves || []).forEach(m => { if (m.initial === undefined && m.note === 'Valor que já tinha') m.initial = true; }));

  S = Object.assign(emptyState(), d); migrate();
  pulling = true; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} pulling = false;
  applyTheme(); render(); return true;
}
async function cloudPull() { const snap = await cloudDoc().get(); return snap.exists ? snap.data() : null; }
async function cloudFirstSync() {
  let r; try { r = await cloudPull(); } catch (e) { cloudMsg = 'Sem conexão com a nuvem agora.'; return; }
  const linked = localStorage.getItem(CLOUD_UID) === cloud.user.uid;
  if (!r) { await cloudPush(); toast('Seus dados foram guardados na sua conta'); return; }
  if (linked) {
    if ((r.updatedAt || 0) > (S.updatedAt || 0)) { if (cloudApply(r)) toast('Dados atualizados da nuvem'); }
    else if ((r.updatedAt || 0) < (S.updatedAt || 0)) await cloudPush();
    return;
  }
  /* primeira vez neste aparelho: a pessoa escolhe */
  const useCloud = await askConfirm({ title: 'Sua conta já tem dados', message: `Os dados da nuvem são de ${fmtDay.format(new Date(r.updatedAt || Date.now()))}. Quer usar os dados da nuvem neste aparelho? Se escolher "Manter os deste", os dados deste aparelho vão para a nuvem.`, ok: 'Usar da nuvem', no: 'Manter os deste' });
  if (useCloud) { cloudApply(r); localStorage.setItem(CLOUD_UID, cloud.user.uid); toast('Dados da nuvem abertos'); } else await cloudPush();
}
async function cloudCheck() { if (!cloudUser() || cloudBusy) return; try { const r = await cloudPull(); if (r && (r.updatedAt || 0) > (S.updatedAt || 0) && cloudApply(r)) toast('Dados atualizados da nuvem'); } catch (e) {} }
function cloudSaveConf() {
  const c = parseConf(($('#f-fbconf') || {}).value || '');
  if (!c) { toast('Não achei a configuração. Copie o bloco inteiro do Firebase.'); return; }
  localStorage.setItem(CLOUD_KEY, JSON.stringify(c)); cloudMsg = ''; render(); cloudStart();
}
const AUTH_ERR = { 'auth/invalid-credential': 'E-mail ou senha errados.', 'auth/wrong-password': 'E-mail ou senha errados.', 'auth/user-not-found': 'Não existe conta com esse e-mail. Toque em "Criar conta".',
  'auth/email-already-in-use': 'Já existe conta com esse e-mail. Toque em "Entrar".', 'auth/weak-password': 'A senha precisa ter pelo menos 6 letras ou números.',
  'auth/invalid-email': 'Esse e-mail não parece certo.', 'auth/missing-password': 'Digite a senha.', 'auth/operation-not-allowed': 'No Firebase, ative o login por "E-mail/senha" (passo 3).',
  'auth/network-request-failed': 'Sem internet agora.',
  'auth/unauthorized-domain': 'No Firebase, em Authentication > Configurações > Domínios autorizados, adicione alexsandermoreir.github.io.',
  'auth/account-exists-with-different-credential': 'Esse e-mail já entrou de outro jeito. Use e-mail e senha.', 'auth/too-many-requests': 'Muitas tentativas. Espere um pouco e tente de novo.' };
async function cloudAuth(what) {
  if (!cloud || !cloud.auth) { toast('Ainda conectando. Espere um pouco.'); return; }
  const email = ($('#f-email') || {}).value.trim(), pass = ($('#f-pass') || {}).value;
  if (!email) { toast('Digite seu e-mail.'); return; }
  try {
    if (what === 'reset') { await cloud.auth.sendPasswordResetEmail(email); toast('Mandamos um e-mail para trocar a senha'); return; }
    if (what === 'signup') await cloud.auth.createUserWithEmailAndPassword(email, pass); else await cloud.auth.signInWithEmailAndPassword(email, pass);
    cloudMsg = ''; toast('Pronto, você entrou');
  } catch (e) { cloudMsg = AUTH_ERR[e && e.code] || ('Não deu certo: ' + (e && e.message || 'erro')); render(); }
}
/* Entrar com a conta Google: abre a janela do Google; se o iPhone não deixar, vai e volta pela página do Google */
async function cloudGoogle() {
  if (!cloud || !cloud.auth) { toast('Ainda conectando. Espere um pouco.'); return; }
  const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({ prompt: 'select_account' });
  try { await cloud.auth.signInWithPopup(prov); cloudMsg = ''; toast('Pronto, você entrou'); }
  catch (e) {
    const c = e && e.code;
    if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;
    if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment' || c === 'auth/web-storage-unsupported') {
      try { await cloud.auth.signInWithRedirect(prov); return; } catch (e2) { cloudMsg = AUTH_ERR[e2 && e2.code] || 'Não deu para entrar com o Google. Use e-mail e senha.'; render(); return; }
    }
    cloudMsg = AUTH_ERR[c] || ('Não deu certo: ' + (e && e.message || 'erro')); render();
  }
}
async function cloudSyncNow() {
  if (!cloudUser()) return; cloudBusy = true; cloudMsg = 'Sincronizando…'; render();
  try { const r = await cloudPull(); if (r && (r.updatedAt || 0) > (S.updatedAt || 0)) { cloudApply(r); cloudMsg = 'Dados atualizados da nuvem.'; } else await cloudPush(); }
  catch (e) { cloudMsg = 'Sem conexão com a nuvem agora.'; }
  cloudBusy = false; render();
}
async function cloudLogout() {
  if (!await askConfirm({ title: 'Sair da conta?', message: 'Seus dados continuam neste aparelho e na nuvem. Só para de sincronizar.', ok: 'Sair' })) return;
  try { await cloud.auth.signOut(); } catch (e) {} cloudMsg = ''; render();
}
async function cloudForget() {
  if (!await askConfirm({ title: 'Tirar a configuração?', message: 'Use isso só se colou a configuração errada. Seus dados não são apagados.', ok: 'Tirar' })) return;
  try { if (cloudUser()) await cloud.auth.signOut(); } catch (e) {}
  localStorage.removeItem(CLOUD_KEY); localStorage.removeItem(CLOUD_UID); cloud = null; cloudMsg = ''; render();
}

service cloud.firestore {

}</textarea></label>

    <button class="btn primary" data-act="cloudConf">Salvar configuração</button></section>`;
  if (!cloud || !cloud.ready) { cloudStart(); return h + `<p class="note">Conectando…</p><button class="link" data-act="cloudForget">Tirar a configuração</button>`; }
  if (!cloud.user) return h + `<section class="block"><div class="block-head"><h2>Entrar</h2></div>
    <button class="btn primary" style="margin-top:8px" data-act="cloudGoogle"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#fff" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#fff" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" opacity=".85"/><path fill="#fff" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2z" opacity=".7"/><path fill="#fff" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.8 9.4 6 12 6z" opacity=".55"/></svg><span>Entrar com o Google</span></button>
    <p class="sub-h" style="margin-top:26px">Ou com e-mail e senha</p>
    <label class="f"><span>E-mail</span><input id="f-email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" placeholder="seu@email.com"></label>
    <label class="f"><span>Senha</span><input id="f-pass" type="password" autocomplete="current-password" placeholder="Pelo menos 6 letras ou números"></label>
    <button class="btn soft" style="margin-top:20px" data-act="cloudLogin">Entrar com e-mail</button>
    <div class="btn-row"><button class="btn soft" data-act="cloudSignup">Criar conta</button><button class="btn soft" data-act="cloudReset">Esqueci a senha</button></div>
    <p class="note">Na primeira vez, toque em "Criar conta" com seu e-mail e uma senha nova. Depois, use "Entrar" em qualquer aparelho.</p></section>
    <button class="link" data-act="cloudForget" style="margin-top:20px">Tirar a configuração</button>`;
  return h + `<div class="kvs"><div class="kv"><span>Conta</span><b style="font-size:17px">${esc(cloud.user.email || '')}</b></div></div>
    <p class="note">Toda mudança é salva sozinha na nuvem. Ao abrir o app, ele pega a versão mais nova.</p>
    <button class="btn primary" data-act="cloudSync">Sincronizar agora</button>
    <div class="btn-row"><button class="btn soft" data-act="cloudLogout">Sair da conta</button></div>`;
}

let lastToday = todayKey();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  cloudCheck();
  if (todayKey() !== lastToday) { if (ui.view === lastToday) ui.view = todayKey(); lastToday = todayKey(); render(); }
});

/* =========================================================
   MINÚSCULAS: todo texto da tela em letras minúsculas,
   menos símbolos de moeda (R$, US$), o que você digita e o PDF
   ========================================================= */
/* símbolos e códigos de moeda ficam como são escritos: R$, US$, JP¥, CN¥, TRY, ARS, CLP, JPY… */
const CUR_MAP = (() => {
  const m = new Map(); const add = t => { if (t && t.toLowerCase() !== t) m.set(t.toLowerCase(), t); };
  ['R$', 'US$', 'A$', 'C$', 'NZ$', 'HK$', 'S$'].forEach(add);
  CURS.forEach(([c]) => { add(c); try { curFmt(c).formatToParts(1).forEach(x => { if (x.type === 'currency') add(x.value); }); } catch (e) {} });
  return m;
})();
const CUR_RE = new RegExp(`(^|[^\\p{L}])(${[...CUR_MAP.keys()].sort((a, b) => b.length - a.length).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})(?=$|[^\\p{L}])`, 'gu');
const lowerTxt = v => v.toLowerCase().replace(CUR_RE, (m, pre, tok) => pre + CUR_MAP.get(tok));
function lowerNode(root) {
  if (root.nodeType === 3) { const p = root.parentNode; if (p && !p.closest('#print,script,style,textarea')) { const v = lowerTxt(root.nodeValue); if (v !== root.nodeValue) root.nodeValue = v; } return; }
  if (root.nodeType !== 1 || root.closest('#print,script,style,textarea')) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())) { const p = n.parentNode; if (p.closest('#print,script,style,textarea')) continue; const v = lowerTxt(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }
}
new MutationObserver(ms => ms.forEach(m => { if (m.type === 'characterData') lowerNode(m.target); else m.addedNodes.forEach(lowerNode); }))
  .observe(document.body, { childList: true, subtree: true, characterData: true });
lowerNode(document.body);

/* =========================================================
   ATUALIZAR SOZINHO: o iPhone guarda uma cópia do app.
   Ao abrir (ou voltar para o app), confere se existe versão nova e recarrega.
   ========================================================= */
const APP_VERSION = '2026-10-21.1';
async function checkUpdate() {
  if (SH) return;   /* não recarrega no meio de uma anotação */
  try {
    const t = await (await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' })).text();
    const m = /const APP_VERSION = '([^']+)'/.exec(t);
    if (!m || m[1] === APP_VERSION) return;
    let tried = ''; try { tried = sessionStorage.getItem('upd') || ''; } catch (e) {}
    if (tried === m[1]) return;   /* já tentou esta versão: não fica recarregando */
    try { sessionStorage.setItem('upd', m[1]); } catch (e) {}
    location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
  } catch (e) { /* sem internet: segue com a cópia que tem */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

/* =========================================================
   INÍCIO
   ========================================================= */
(function init() {
  /* só grava se algo mudou, para não passar por cima da versão da nuvem */
  const before = JSON.stringify(S);
  if (isEmpty() && !S.mineLoaded) loadMyData();
  if (!S.novLoaded) loadNovData();
  migrate();
  if (JSON.stringify(S) !== before) save();
  applyTheme();
  $('#fab').innerHTML = ICON.plus;
  drawTabs();
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, 180, 180); x.strokeStyle = '#2B59FF'; x.lineWidth = 16; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath(); x.moveTo(50, 94); x.lineTo(78, 122); x.lineTo(132, 62); x.stroke();
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
  } catch (e) { /* sem canvas */ }
  render();
  if (cloudConf()) cloudStart();
  setTimeout(checkUpdate, 800);
})();
